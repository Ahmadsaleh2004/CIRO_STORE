# ══════════════════════════════════════════════════════════════
# CI — Cairo Store
# ══════════════════════════════════════════════════════════════
#
# The principle: **every tool that runs in the pre-commit hooks runs here too.**
#
# Before this file the whole protection hung off one machine: anyone cloning the repository
# without `pre-commit install` passed everything — no secret scan, no semgrep, no tests. The
# local hook protects whoever installs it; CI protects the repository.
#
# What CI adds over the hooks: tests against a real database, a coverage measurement
# (neither xdebug nor pcov is on the development machine), and a matrix of two PHP versions.
#
# ══════════════════════════════════════════════════════════════
# Pinning the actions — a deliberate decision, not an oversight
# ══════════════════════════════════════════════════════════════
#
# semgrep reports every `uses: …@vN` under its mutable-action-tag rule: a tag is a moving
# pointer its owner can move to any commit, so what CI runs tomorrow may not be what it runs
# today. The rule is right, and the judgement on it differs from action to action — which is
# why the decision here is itemised rather than blanket:
#
#   · aquasecurity/trivy-action  →  **pinned to a digest**. It was `@master`, that is, a
#     live branch and not a tag at all. The most dangerous thing in the file, and it has
#     been dealt with.
#
#   · returntocorp/semgrep-action → **removed**. Abandoned (the publisher moved to semgrep).
#     Replaced by running semgrep through pip at a pinned version.
#
#   · actions/checkout · actions/cache · actions/setup-node  →  they stay on their tags.
#     They come from GitHub itself, and the tag brings their security patches
#     automatically. Pinning them to a digest trades the risk of "the tag moved" for the
#     risk of "frozen on an old version with a known vulnerability" — the larger risk
#     without a Dependabot watching them.
#
#   · shivammathur/setup-php · gitleaks/gitleaks-action  →  they stay on their tags. Third
#     parties, but widely used and actively maintained.
#
# And the context is what makes this decision acceptable, and it is measured rather than
# assumed: `permissions: contents: read` alone · no `pull_request_target` (the trap that
# hands an outside PR the repository's secrets) · and no secret in the file beyond
# GITHUB_TOKEN in one step. So the worst harm from a compromised action here is: reading
# code that is public anyway, and burning CI minutes. Not leaked secrets, and not a write to
# the repository.
#
# ⚠️ Were `pull_request_target` ever added, or the permissions raised to
# `contents: write`, or a deployment secret to enter this file — this whole analysis falls
# and every action must be pinned to its digest.
#
# The deferred decision: a SHA for everything + Dependabot raising a monthly PR with the
# updates. That is the complete answer, and it needs an extra configuration file and a
# decision of its own.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests against a real database ────────────────────────────
  tests:
    name: Tests · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ciro_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4

      - name: Set up PHP
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, json
          # pcov rather than xdebug: far faster for coverage alone, which is all we want.
          coverage: pcov

      - name: The composer cache
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install the dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The tests read their settings from .env exactly as the application does. It is
      # written here rather than copied from .env.example: that file holds empty values on
      # purpose.
      - name: Build a .env for the CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=testing
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8080
          APP_NAME=Cairo Store
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=ciro_db
          DB_USERNAME=root
          DB_PASSWORD=
          EOF

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -u root --silent && exit 0
            sleep 2
          done
          echo "MySQL did not respond"; exit 1

      # The schema is loaded into the development database as well, so the application
      # pages the HTTP test hits actually work. The test database (ciro_db_test) is built by
      # tests/bootstrap.php itself.
      - name: Load the schema
        run: mysql -h 127.0.0.1 -u root ciro_db < tests/fixtures/schema.sql

      # The reference schema already carries the effect of the seven migrations, so they
      # are recorded as applied without being run. After that nothing may remain pending: a
      # migration added without updating tests/fixtures/schema.sql means the tests run
      # against a structure that does not match what production will see.
      - name: Migrations up to date against the schema
        run: |
          php scripts/migrate.php baseline
          PENDING=$(php scripts/migrate.php status | grep -c -- '— pending$' || true)
          if [ "$PENDING" != "0" ]; then
            echo "::error::Migrations pending after baseline — run 'composer test:schema' and commit the result."
            php scripts/migrate.php status
            exit 1
          fi
          echo "No pending migrations."

      # The CSRF contract test hits live HTTP endpoints. Without a server it skips itself —
      # that is, it becomes a guard that guards nothing. The built-in server is enough: it
      # serves the files that exist and routes the rest to index.php, exactly as the
      # mod_rewrite rule does.
      - name: Start the application server
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 1
          done
          echo "The server did not respond:"; cat /tmp/server.log; exit 1

      - name: Tests with coverage
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text

      # ⚠️ The gate is a ratchet: it holds the figure **actually measured**, so it fails on a
      # regression rather than on failing to reach an aspiration. It moves up with each new
      # batch of tests and never down without a reason written beside it.
      #
      # It said 25% and claimed that was "the figure actually reached today". It was not:
      # the real number is 10%, and the gate had been failing every push on every branch —
      # so the one job that measures coverage was permanently red and therefore ignored,
      # which is the exact outcome the note above it was written to prevent.
      #
      # And the number was unverifiable on the machine it was written on: no pcov, no
      # xdebug, so `phpunit --coverage` produced nothing locally and 25% could only ever
      # have been a guess. That is fixed on the developer side (php.ini now loads pcov,
      # disabled by default), and `composer test:coverage:gate` runs this same computation
      # before a push rather than after it.
      #
      # Measured with pcov, the same driver this job uses:
      #
      #                     when the gate was fixed        now
      #     Controllers     5,094 stmts    0    0.0%    4,783   102    2.1%
      #     Models          2,281 stmts  424   18.6%    2,281   439   19.2%
      #     Core              808 stmts  412   51.0%      812   451   55.5%
      #     Services          217 stmts   73   33.6%      217    73   33.6%
      #     config            494 stmts   15    3.0%      494    15    3.0%
      #     helpers           229 stmts   18    7.9%      229    20    8.7%
      #     TOTAL           9,123 stmts  942   10.3%    8,816 1,100   12.5%
      #
      # Which says something more useful than the single number does. Core and Services are
      # genuinely tested; the average is held down by app/Controllers, over half of
      # everything measured.
      #
      # Controllers stood at a flat 0.0% and the reason was not that nobody had tested
      # them. Controller::respond() ends a request with `exit`, so calling any of the 225
      # actions that end that way took the test runner down with it — and testing them over
      # HTTP, as CsrfContractHttpTest does, runs the code in the *server's* process where
      # this driver cannot see it. app/Core/ResponseSent.php is the seam that changed that:
      # under the CLI alone, a finished response throws instead of exiting.
      #
      # Raising this gate further means more of those tests, not excluding app/Controllers
      # from `source` in phpunit.xml: excluding it would print a much prettier number for
      # exactly the same untested code.
      - name: The coverage gate
        if: matrix.php == '8.3'
        run: |
          PCT=$(php -r '
            $x = simplexml_load_file("coverage.xml");
            $m = $x->project->metrics;
            printf("%.1f", (int)$m["statements"] ? (int)$m["coveredstatements"] / (int)$m["statements"] * 100 : 0);
          ')
          echo "Line coverage: ${PCT}%"
          php -r "exit((float)'$PCT' >= 12.0 ? 0 : 1);" \
            || { echo "::error::Coverage of ${PCT}% is below the 12.0% floor — it may not go down"; exit 1; }

  # ── Code quality ─────────────────────────────────────────────
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, json
          coverage: none

      - name: Install the dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: PSR-12
        run: vendor/bin/phpcs --report=full

      # The escaping gate: every `<?= ?>` in the views is classified, and NEEDS — output in
      # the page's body, where an injected <script> runs — must stay at zero.
      # The tool used to be a report read by whoever remembered to run it; and a report that
      # fails nothing turns into a number that grows quietly.
      - name: The escaping gate over the views
        run: php scripts/audit-escaping.php --gate

      # The README's numbers are measured from the code rather than written by hand. Every
      # one of them had drifted: 77 tests when there were 250, and 28 tables when there were
      # 31, and a sentence saying "the CSP is report-only" while the policy was fully
      # enforced. The project's front door had come to describe an older project than the one
      # that exists.
      #
      # The same logic as the OpenAPI gate below: what is written by hand ages, what is
      # generated does not.
      - name: The README's numbers are current
        run: php scripts/sync-readme-stats.php --check

  # ── The API specification ────────────────────────────────────
  #
  # The specification is generated from PHP attributes, so an error in it shows up only to
  # somebody opening the /docs page — and nobody may do that for months. This check makes a
  # broken specification fail the build rather than wait for a discoverer.
  #
  # And the coverage gate (every route documented, and no operation without a route) lives
  # in tests/Integration/OpenApiCoverageTest.php within the tests job.
  openapi:
    name: The OpenAPI specification
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install the dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The specification is both tracked in git and generated, so it can fall behind the
      # code: somebody edits an OA attribute and forgets docs:generate. Regenerating it and
      # comparing the result with what was committed catches that immediately.
      #
      # ⚠️ The comparison lives in scripts/docs-check.php rather than in these eight lines
      # of shell, and that is the whole point. Written here, it could only ever be run by
      # CI — so `composer check`, whose entire job is "run the gates before pushing", did
      # not include it, and the only way to learn the specification had drifted was to push
      # and wait. It is now `composer docs:check` in both places, which is the same code.
      #
      # The script also normalises line endings on both sides before comparing. Without
      # that, this check could never pass for a developer on Windows: swagger-php joins
      # description lines with PHP_EOL, so the same source produces `\r\n` there and `\n`
      # here — 182 bytes of difference across 91 descriptions, none of it in the API.
      #
      # And it reports the difference through `::error::` rather than to the log alone,
      # because an Actions log needs a signed-in session (the REST endpoint answers 403)
      # while annotations are readable through the public API. A failure nobody can read
      # gets guessed at instead of fixed.
      - name: Check that the specification is current
        run: composer docs:check

      - name: spectral — lint the specification
        run: npx --yes @stoplight/spectral-cli lint public/docs/openapi.yaml --ruleset .spectral.yaml

  # ── The front end ────────────────────────────────────────────
  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npx eslint public/js --max-warnings 60

      - name: Stylelint
        run: npx stylelint "public/css/**/*.css"

      # The front-end tests load the public/js files into jsdom on the global scope — as
      # the browser does. So what is tested is the working code itself, not an altered copy
      # of it made to be testable.
      - name: Vitest
        run: npx vitest run

      # The CSS bundles are both tracked in git and generated, so they can fall behind:
      # somebody edits a CSS file and forgets `npm run build`, and what is deployed keeps
      # serving the old version — the worst case of all: the code is right and what is shown
      # is old. Rebuilding and comparing the fingerprint catches that immediately.
      - name: The CSS bundles are current
        run: |
          cp public/css/dist/manifest.json /tmp/committed.json
          npm run build
          if ! diff -q /tmp/committed.json public/css/dist/manifest.json > /dev/null; then
            echo "::error::The CSS bundles are behind — run 'npm run build' and commit public/css/dist/."
            echo "Committed:"; cat /tmp/committed.json
            echo "Expected:"; cat public/css/dist/manifest.json
            exit 1
          fi
          echo "The bundles match the source."

  # ── The performance and accessibility budget ─────────────────
  #
  # The thresholds are built on what the project achieves today rather than on wishes: a
  # gate that fails from day one is switched off within a week. Performance and SEO are
  # warnings, while accessibility and best practices are errors — because those two do not
  # fluctuate with the network.
  #
  # Deliberately fixed paths: the home page (a slider and cards), the product listing (the
  # heaviest page), and a static page as a control.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ciro_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, json
          coverage: none

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci

      - name: Build the bundles
        run: npm run build

      - name: Build a .env and load the schema
        run: |
          cat > .env <<'ENVEOF'
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8080
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=ciro_db
          DB_USERNAME=root
          DB_PASSWORD=
          ENVEOF
          for i in $(seq 1 30); do mysqladmin ping -h 127.0.0.1 -u root --silent && break; sleep 2; done
          mysql -h 127.0.0.1 -u root ciro_db < tests/fixtures/schema.sql

      - name: Start the server
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/lh-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/lh-server.log; exit 1

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun

  # ── Security ─────────────────────────────────────────────────
  # The same three tools that run in .pre-commit-config.yaml.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full history: a secret deleted in the last commit remains in
          # the history, and scanning the final snapshot alone does not see it.
          fetch-depth: 0

      - name: gitleaks — secrets across the whole history
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # ⚠️ This used to be `uses: returntocorp/semgrep-action@v1` — which is **abandoned**:
      # the publisher moved from returntocorp to semgrep, and the action is no longer
      # maintained. Pinning it to a digest would have turned the gate green while freezing it
      # on abandoned code — hiding the problem rather than solving it.
      #
      # What replaces it here is what the pre-commit hooks do — the same command, the same
      # rules and the same version. Which serves this file's principle stated above: "every
      # tool that runs in the pre-commit hooks runs here too". And it is one dependency
      # fewer: a version-pinned pip package instead of a whole third-party action.
      #
      # ⚠️ That sentence used to say "literally what the pre-commit hooks do — the same
      # command and the same rules", and it was not true. The hook ran
      # `semgrep --config auto` on `language: system`, so it resolved a *different* rule set
      # through whichever semgrep sat on the developer's PATH — 1.174.0 against the 1.145.0
      # pinned below. The two disagreed by more than rules: the newer one scanned 185 files
      # where this scans 343, and reported zero findings where this reported nine. So the
      # local gate went green, the push was made on the strength of it, and CI went red on
      # code the developer had just been told was clean.
      #
      # A comment asserting an equivalence that does not hold is worse than no comment: it
      # is the reason nobody thought to check. The hook now carries this exact command and
      # pins this exact version, and the version is stated in .pre-commit-config.yaml —
      # if it moves there, move it here in the same commit.
      #
      # `--error` is required: without it semgrep prints the findings and exits 0, so it
      # looks successful while reporting vulnerabilities.
      - name: semgrep — code vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.145.0
          semgrep --config p/php --config .semgrep/ --error .

      - name: trivy — dependency vulnerabilities
        # ⚠️ Pinned to a commit digest rather than a tag. It was `@master` — a **live branch**
        # and not a tag at all: it changes with every push to upstream, so what CI runs
        # tomorrow may not be what it runs today.
        #
        # The digest below is the v0.36.0 tag resolved to its commit. To update it:
        #   curl -s https://api.github.com/repos/aquasecurity/trivy-action/git/ref/tags/<tag>
        #   then dereference the tag object if type=tag — Actions accepts the commit digest
        #   alone.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
