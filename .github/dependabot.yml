# ══════════════════════════════════════════════════════════════
# Dependabot — تحديثات الاعتماديات
# ══════════════════════════════════════════════════════════════
#
# هذا هو «القرار المؤجَّل» المكتوب في رأس .github/workflows/ci.yml:
#
#     «SHA لكل شيء + Dependabot يرفع PR شهرياً بالتحديثات. وهو الحلّ
#      الكامل، ويحتاج ملف إعداد إضافي وقراراً مستقلاً.»
#
# والقرار الآن: نعم للنصف الثاني. ولذلك يشمل هذا الملف
# `github-actions` أيضاً — فالتحليل المكتوب في CI يبرّر ترك الإجراءات
# بوسومها **بشرط** أن تصلها تصحيحاتها الأمنية، وDependabot هو من
# يضمن ذلك بدل الاعتماد على أن يتذكّر أحدهم.
#
# ── لماذا شهرياً لا أسبوعياً ────────────────────────────────
#
# مشروع بمشرف واحد. تدفّق PR أسبوعي في أربع أنظمة يعني تراكم PRات لا
# تُراجَع — وطابور تحديثات مهملة أسوأ من غيابه: يعطي انطباع التغطية
# بلا تغطية، ويدرّب صاحبه على إغلاق الإشعارات بلا قراءة.
#
# والأمان لا ينتظر الجدول على أي حال: تنبيهات Dependabot الأمنية
# ترفع PR فور صدور الثغرة بلا علاقة بهذه الوتيرة، وtrivy في CI يفشل
# البناء عند أي ثغرة معروفة في composer.lock.
#
# ── open-pull-requests-limit ────────────────────────────────
#
# محدود عمداً. الرقم الافتراضي (5 لكل نظام) يعني عشرين PR مفتوحاً في
# أسوأ الأحوال على مستودع يراجعه شخص واحد.

version: 2

updates:
  # ── اعتماديات PHP ──────────────────────────────────────────
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # تحديثات الصيانة تُجمَع في PR واحد: هي ما لا يكسر شيئاً
      # بحكم semver، ومراجعتها واحداً واحداً عمل بلا عائد.
      # والتحديثات الكبرى تبقى منفصلة لأنها هي التي تحتاج قراءة.
      php-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── أدوات الواجهة ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      js-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── إجراءات GitHub ─────────────────────────────────────────
  #
  # ci.yml يترك actions/checkout وأخواتها بوسومها عمداً، ويبرّر ذلك
  # بأن الوسم يجلب تصحيحاتها الأمنية تلقائياً. وهذا صحيح للتصحيحات
  # داخل النسخة الكبرى وحدها — أمّا الانتقال من v4 إلى v5 فلا يحدث
  # وحده. هنا يأتي دور هذا القسم.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci

  # ── صورة الحاوية ───────────────────────────────────────────
  #
  # Dockerfile يثبّت php:8.3-apache. الوسم يتحرّك مع تصحيحات PHP،
  # لكن الانتقال إلى 8.4 قرارٌ يجب أن يُرى في PR لا أن يقع صامتاً
  # عند إعادة بناء الصورة.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
