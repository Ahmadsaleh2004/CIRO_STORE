# ══════════════════════════════════════════════════════════════
# Dependabot — dependency updates
# ══════════════════════════════════════════════════════════════
#
# This is the "deferred decision" written at the top of .github/workflows/ci.yml:
#
#     "A SHA for everything + Dependabot raising a monthly PR with the updates. That is the
#      complete answer, and it needs an extra configuration file and a decision of its own."
#
# And the decision now is: yes to the second half. Which is why this file covers
# `github-actions` as well — the analysis written in CI justifies leaving the actions on
# their tags **on the condition** that their security patches reach them, and Dependabot is
# what guarantees that rather than relying on somebody remembering.
#
# ── Why monthly rather than weekly ──────────────────────────
#
# A project with one maintainer. A weekly PR stream across four ecosystems means a pile-up
# of unreviewed PRs — and a neglected queue of updates is worse than none: it gives the
# impression of coverage without the coverage, and trains its owner to close notifications
# unread.
#
# And security does not wait for the schedule in any case: Dependabot's security alerts
# raise a PR the moment a vulnerability is published, regardless of this cadence, and trivy
# in CI fails the build on any known vulnerability in composer.lock.
#
# ── open-pull-requests-limit ────────────────────────────────
#
# Deliberately capped. The default (5 per ecosystem) means twenty open PRs at worst on a
# repository reviewed by one person.

version: 2

updates:
  # ── Why every entry carries a cooldown ─────────────────────
  #
  # A cooldown makes Dependabot wait before proposing a release that has just been
  # published. The attack it answers is the one that actually happens to package registries:
  # an account is compromised, a malicious version is published, and it is pulled and yanked
  # within hours. Without a wait, an automated PR can carry that version into the repository
  # inside the window in which it existed.
  #
  # Seven days is the value semgrep's rule asks for, and it costs nothing here: the schedule
  # is monthly anyway, so the delay never actually holds anything up. And the security
  # alerts are not affected — those raise a PR the moment a vulnerability is published,
  # regardless of the cooldown.

  # ── The PHP dependencies ───────────────────────────────────
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # The maintenance updates are grouped into one PR: they are the ones that break
      # nothing by semver's rule, and reviewing them one by one is work with no return.
      # The major updates stay separate because they are the ones needing a read.
      php-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── The front-end tooling ──────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      js-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── The GitHub actions ─────────────────────────────────────
  #
  # ci.yml deliberately leaves actions/checkout and its siblings on their tags, and
  # justifies that by the tag bringing their security patches automatically. Which is true
  # for patches within the same major version alone — the move from v4 to v5 does not happen
  # by itself. That is where this section comes in.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci

  # ── The container image ────────────────────────────────────
  #
  # The Dockerfile pins php:8.5.12-apache, down to the patch. It used to pin the floating
  # 8.3-apache tag and let PHP's patches arrive on the next rebuild, until CVE-2026-109618
  # and CVE-2026-109619 showed what that costs: a rebuild serving an older cached layer puts
  # a remote code execution hole back without a line of the repository changing. Each patch
  # now has to be raised here, in a PR — and so does the next minor version, which changes
  # what the code is allowed to call and belongs in a PR that CI has tested.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - dependencies
