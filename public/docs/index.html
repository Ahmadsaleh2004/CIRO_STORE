<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cairo Store — API Docs</title>

    <!--
        Swagger UI from jsDelivr, **at a pinned version and with an SRI digest**.

        This used to be `swagger-ui-dist@5` with no integrity — that is, a moving version
        from a third party, executed with complete trust on this page. Had the CDN been
        compromised or a malicious 5.x published, a foreign script would have run on the
        site's own origin and inside the admin's open session.

        `integrity` makes the browser reject the file if its digest does not match, and
        `crossorigin="anonymous"` is required for that check to run at all on a
        cross-origin resource (without it the browser ignores the attribute silently).

        ⚠️ The version is pinned to 5.32.14 on purpose, not by oversight: the digest is
        computed over one particular file's content, and a moving `@5` would have broken the
        page at the first update. To upgrade it: change the version number in both links,
        then recompute both digests with
            curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui.css"
          integrity="sha384-fgyWYkUAamzuI8mJFu/xpRP0JWCJRwkwUwsYDoOYVHUJ8NQE5cENn8ib3ppwFFSX"
          crossorigin="anonymous">
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui-bundle.js"
            integrity="sha384-Dt83RhU85ZmX7werw9uTFCzmauXUoSyx3pdzTQMABtsnFmooJy4Vz9/ACh7n5m1A"
            crossorigin="anonymous"></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: './openapi.yaml',
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis],
            });
        };
    </script>
</body>
</html>
