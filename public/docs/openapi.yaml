openapi: 3.0.0
info:
  title: 'Cairo Store API'
  description: "Every store and admin-panel endpoint.\n\nA general note on errors: the JSON endpoints in this project return 200 even\nwhen validation fails, and the outcome is read from the `success` field in the\nbody rather than from the HTTP status. The only exceptions are 302 (redirect\nto sign-in), 403 (missing permission) and 404 (unregistered route). This is\nexisting behaviour the front end depends on, and it is documented here as it\nis rather than as it ought to be."
  version: 1.1.0
servers:
  -
    url: 'http://localhost/STORE/public'
    description: 'Local / Development Server'
paths:
  /admin/settings:
    get:
      tags:
        - 'Admin - Site Settings'
      summary: 'Show the current site settings page'
      operationId: 634d1801e5ae45f856fbfc627b8bcd25
      responses:
        '200':
          description: 'HTML page — requires the can_edit_site_content permission'
        '302':
          description: 'Redirect to /admin/login'
        '403':
          description: 'Forbidden — the admin lacks can_edit_site_content'
      security:
        -
          adminSessionAuth: []
    post:
      tags:
        - 'Admin - Site Settings'
      summary: 'Save site settings (AJAX) — the financial and currency fields are accepted only from a holder of can_manage_checkout_settings'
      description: "AdminSiteSettingsController — the admin's site settings page.\nExtends AdminController, which verifies the admin login automatically."
      operationId: 3e053842fbd06f520e821e6726b6fe5f
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - csrf_token
              properties:
                csrf_token:
                  type: string
                footer_text:
                  type: string
                facebook_url:
                  type: string
                instagram_url:
                  type: string
                snapchat_url:
                  type: string
                whatsapp_number:
                  type: string
                tiktok_url:
                  type: string
                twitter_x_url:
                  type: string
                google_maps_url:
                  type: string
                copyright_text:
                  type: string
                phone_number:
                  type: string
                working_hours:
                  type: string
                employees_count:
                  type: integer
                site_url:
                  type: string
                return_policy:
                  type: string
                privacy_policy:
                  type: string
                terms_and_conditions:
                  type: string
                default_currency:
                  description: 'Only for a holder of can_manage_checkout_settings'
                  type: string
                default_language:
                  description: 'Only for a holder of can_manage_checkout_settings'
                  type: string
              type: object
      responses:
        '200':
          description: 'Whether the save succeeded'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /about:
    get:
      tags:
        - 'Store - Pages'
      summary: "About page — the store's static details plus the visible product count"
      operationId: 6da6392c8a0f7198065416a7e1062f26
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '404':
          $ref: '#/components/responses/NotFoundPage'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/login:
    get:
      tags:
        - 'Admin - Auth'
      summary: 'Render the admin sign-in page'
      operationId: d3b445322ac83354e1501b04eeea68b7
      responses:
        '200':
          description: 'Sign-in HTML page'
    post:
      tags:
        - 'Admin - Auth'
      summary: 'Sign the admin in'
      operationId: f605c43a8e23a8d3a236178d7f5cf925
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - email
                - password
                - csrf_token
              properties:
                email:
                  description: "The admin's email address"
                  type: string
                  format: email
                password:
                  description: Password
                  type: string
                  format: password
                csrf_token:
                  description: 'CSRF token — always required'
                  type: string
                h-captcha-response:
                  description: 'hCaptcha response — required after the first failed attempt'
                  type: string
              type: object
      responses:
        '200':
          description: 'Whether the sign-in succeeded'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  redirect: { description: 'Present on success only', type: string }
                  show_captcha: { description: 'Present on failure — means hCaptcha must be shown', type: boolean }
                  failed_attempts: { description: 'Number of failed attempts', type: integer }
                type: object
  /admin/login/2fa:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'The second step of the admin sign-in — verifying the TOTP code'
      description: 'Called after /admin/login returns the requires_2fa field. The code comes from an authenticator app (Google Authenticator or similar).'
      operationId: e7030ff592552764ee24f00281a3823c
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - code
                - csrf_token
              properties:
                code:
                  description: 'Six-digit TOTP code'
                  type: string
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'Operation result. The success field separates success from failure — the HTTP status stays 200 either way. On CSRF failure the body carries error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /admin/logout:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'Sign the admin out'
      operationId: 5bc6c0aaaefe4ef3e155d33f1085c096
      responses:
        '302':
          description: 'Redirect to /admin/login after the session is destroyed'
  /admin/forgot:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'Request an admin password reset link'
      description: 'The message returned is the same whether the email exists or not, so the endpoint does not disclose which addresses are registered as admins.'
      operationId: 130cea99c5909844a7e4be7451bce9a8
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - email
                - csrf_token
              properties:
                email:
                  type: string
                  format: email
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'Operation result. The success field separates success from failure — the HTTP status stays 200 either way. On CSRF failure the body carries error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /admin/store-mode/enter:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'Put the admin into store-browsing mode, as a visitor (Store Mode)'
      operationId: 6f56f79b4b92334c5dbcae224315b3f5
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - csrf_token
              properties:
                csrf_token:
                  description: 'CSRF token — always required'
                  type: string
              type: object
      responses:
        '302':
          description: 'Redirect to the store / once store mode is set'
        '401':
          description: 'Not signed in (AJAX/POST)'
  /admin/store-mode/reauth:
    get:
      tags:
        - 'Admin - Auth'
      summary: 'Show the password re-authentication page before returning to the panel'
      operationId: 1e62213c6d5d92b4fdce0e924902f5aa
      responses:
        '200':
          description: 'A standalone HTML page for re-authentication'
        '302':
          description: 'Redirect to /admin/home when the admin is not in store mode'
    post:
      tags:
        - 'Admin - Auth'
      summary: 'Re-authenticate the admin by password before returning to the panel (JSON)'
      operationId: 64d4315e901132618b9471c6aeb5ec11
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - password
                - csrf_token
              properties:
                password:
                  description: "The admin's password"
                  type: string
                  format: password
                csrf_token:
                  description: 'CSRF token — always required'
                  type: string
                return:
                  description: 'Return destination (optional) — guarded against open redirects'
                  type: string
              type: object
      responses:
        '200':
          description: 'Whether the check succeeded'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  redirect: { description: 'Present on success only', type: string }
                type: object
  /admin/csrf:
    get:
      tags:
        - 'Admin - Auth'
      summary: 'Issue a fresh CSRF token for the admin forms'
      operationId: 023c6f87e86c774e5c00533c18b0b90a
      responses:
        '200':
          description: 'A fresh CSRF token'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  token: { description: 'CSRF token hex string', type: string }
                type: object
  /admin/branding:
    get:
      tags:
        - 'Admin - Branding'
      summary: 'Show the slider management page'
      operationId: 04da49ab824daf342dfe454feda55cdb
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/RedirectToLogin'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        -
          adminSessionAuth: []
  /admin/branding/products/search:
    get:
      tags:
        - 'Admin - Branding'
      summary: 'Live product search for slider selection (AJAX)'
      operationId: 185ea70d9c6ff55d56d576baa2b5d789
      parameters:
        -
          name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'Operation result. The success field separates success from failure — the HTTP status stays 200 either way. On CSRF failure the body carries error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/branding/save:
    post:
      tags:
        - 'Admin - Branding'
      summary: 'Save the whole slider (full replace) — slides, items and image uploads'
      operationId: 373a97f2a24a1dc606e7649ae9fca3a2
      requestBody:
        required: true
        content:
          multipart/form-data: {  }
      responses:
        '302':
          $ref: '#/components/responses/RedirectWithFlash'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/dashboard:
    get:
      tags:
        - 'Admin - Dashboard'
      summary: 'Admin dashboard statistics (sales, orders, users, best-selling products)'
      operationId: 5a10c70d52102afac94342c298f09cad
      parameters:
        -
          name: q
          in: query
          description: 'Optional name search within the best-sellers list'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Dashboard HTML page — requires a valid admin_session and the can_view_dashboard permission'
        '302':
          description: 'Redirect to /admin/login when the session is not valid'
        '403':
          description: 'Forbidden — the admin lacks the can_view_dashboard permission'
      security:
        -
          adminSessionAuth: []
  /admin/home:
    get:
      tags:
        - 'Admin - Home'
      summary: 'Admin panel home page'
      operationId: 5f2b0324a493fd085fc513c017fc963f
      responses:
        '200':
          description: 'Admin panel HTML page — requires a valid admin_session'
        '302':
          description: 'Redirect to /admin/login when the session is not valid'
      security:
        -
          adminSessionAuth: []
  /admin/admins:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'List every admin together with their permissions'
      operationId: 9159b1b855dae051e4af33f4dc0eff6d
      responses:
        '200':
          description: 'HTML page with the table — requires the can_manage_admins permission'
        '403':
          description: 'Forbidden — the admin lacks can_manage_admins'
      security:
        -
          adminSessionAuth: []
  /admin/admins/add:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'Show the add-admin form'
      operationId: 9eb0ffcb6b3931118276117fa7237887
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/RedirectToLogin'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        -
          adminSessionAuth: []
    post:
      tags:
        - 'Admin - Manage Admins'
      summary: "Add a new admin (requires a reason and the acting admin's password)"
      operationId: b2d4e525109310fa73bd53ed9159b66d
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - new_name
                - new_email
                - new_password
                - new_role
                - add_reason
                - confirm_current_pass
                - csrf_token
              properties:
                new_name:
                  type: string
                new_email:
                  description: 'Must end in @gmail.com'
                  type: string
                  format: email
                new_phone:
                  type: string
                new_password:
                  type: string
                  format: password
                new_role:
                  description: 'A|B|C|D — must be strictly lower than your own rank'
                  type: string
                perm_admins:
                  type: boolean
                perm_products:
                  type: boolean
                perm_users:
                  type: boolean
                perm_dashboard:
                  type: boolean
                perm_support:
                  type: boolean
                perm_content:
                  type: boolean
                perm_branding:
                  type: boolean
                perm_checkout:
                  type: boolean
                perm_orders:
                  type: boolean
                add_reason:
                  type: string
                confirm_current_pass:
                  type: string
                  format: password
                csrf_token:
                  type: string
              type: object
      responses:
        '302':
          $ref: '#/components/responses/RedirectWithFlash'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/admins/edit:
    post:
      tags:
        - 'Admin - Manage Admins'
      summary: "Save a change to an admin's rank or permissions (requires a reason and the acting admin's password)"
      operationId: 23326486824d40055b9d9ed454b088d1
      responses:
        '302':
          $ref: '#/components/responses/RedirectWithFlash'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/admins/delete:
    post:
      tags:
        - 'Admin - Manage Admins'
      summary: 'Delete an admin (AJAX — returns JSON; requires a reason and a password)'
      operationId: d63d8a22bfb1db8f2c0bfc8f806f9c80
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - target_id
                - delete_reason
                - confirm_del_pass
                - csrf_token
              properties:
                target_id:
                  type: integer
                delete_reason:
                  type: string
                confirm_del_pass:
                  type: string
                  format: password
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'Success or failure'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /admin/admins/details:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'Details for one admin: profile, order activity, and their action log'
      operationId: 8b119ec8062bda0941bc4b18ad7dc779
      parameters:
        -
          name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/RedirectToLogin'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        -
          adminSessionAuth: []
  /admin/admins/export-csv:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'Export the admin list as a CSV file — rank A only'
      operationId: 407baf53eac765c467db8fcdff2e886a
      responses:
        '200':
          $ref: '#/components/responses/CsvDownload'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/messaging/notify:
    post:
      tags:
        - 'Admin - Messaging'
      summary: 'Send a direct message to an admin or a user (AJAX)'
      operationId: 73cc265efb790ccc50f0f6a1a6d839fb
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - target_type
                - target_id
                - title
                - message
                - csrf_token
              properties:
                target_type:
                  description: "'admin' or 'user'"
                  type: string
                target_id:
                  type: integer
                title:
                  type: string
                message:
                  type: string
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /admin/messaging/broadcast:
    post:
      tags:
        - 'Admin - Messaging'
      summary: 'Send a broadcast (AJAX) — admins by permission and rank, or users by status'
      operationId: 724f415bb841000f324c16023b863562
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - title
                - body
                - csrf_token
              properties:
                target_type:
                  description: "'admin' (permissions + ranks) or 'user' (statuses)"
                  type: string
                  enum: [admin, user]
                title:
                  type: string
                body:
                  type: string
                perms:
                  description: 'Admins only'
                  type: array
                  items: { type: string }
                ranks:
                  description: 'Admins only'
                  type: array
                  items: { type: string }
                statuses:
                  description: 'Users only'
                  type: array
                  items: { type: string, enum: [active, not_active, blocked] }
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /admin/my-info:
    get:
      tags:
        - 'Admin - My Info'
      summary: "Show the admin's own account page"
      operationId: 15738aa88d77264ebe6bd5f675809a65
      responses:
        '200':
          description: 'Admin account HTML page — requires a valid admin_session'
        '302':
          description: 'Redirect to /admin/login when the session is not valid'
      security:
        -
          adminSessionAuth: []
    post:
      tags:
        - 'Admin - My Info'
      summary: "Update the admin's account details (name / phone / password)"
      operationId: 2700a423dbe09207ba93b4bc4af11330
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - csrf_token
                - full_name
                - current_password
              properties:
                csrf_token:
                  type: string
                full_name:
                  type: string
                phone_number:
                  type: string
                new_password:
                  description: 'Optional — leave it empty to keep the current password'
                  type: string
                  format: password
                current_password:
                  description: 'Always required, as confirmation before saving'
                  type: string
                  format: password
              type: object
      responses:
        '200':
          description: 'Whether the update succeeded'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /admin/my-info/2fa/generate:
    post:
      tags:
        - 'Admin - My Info'
      summary: 'Generate a new TOTP secret and QR code for enabling two-factor authentication'
      description: 'This does not enable 2FA yet — enabling happens at /admin/my-info/2fa/confirm once the authenticator app has proved it produces the right code.'
      operationId: 79533270d49ee00862b4addb0218fbb2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - csrf_token
              properties:
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'JSON — {success, message, secret, qr}'
      security:
        -
          adminSessionAuth: []
  /admin/my-info/2fa/confirm:
    post:
      tags:
        - 'Admin - My Info'
      summary: 'Confirm and enable two-factor authentication with a code from the app'
      description: 'Confirm enabling 2FA — verifies a first valid code before saving, which is the safe order.'
      operationId: d0cb964874c9888281346775acddcea0
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - code
                - csrf_token
              properties:
                code:
                  description: 'Six-digit TOTP code'
                  type: string
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'Operation result. The success field separates success from failure — the HTTP status stays 200 either way. On CSRF failure the body carries error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/my-info/2fa/disable:
    post:
      tags:
        - 'Admin - My Info'
      summary: 'Disable two-factor authentication'
      description: 'Requires the current password — an open session is not enough.'
      operationId: fea030f1df1b77403b3e10f844048121
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - password
                - csrf_token
              properties:
                password:
                  type: string
                  format: password
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'Operation result. The success field separates success from failure — the HTTP status stays 200 either way. On CSRF failure the body carries error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/notifications/list:
    get:
      tags:
        - 'Admin - Notifications'
      summary: "The current admin's notifications plus the unread count (AJAX — JSON)"
