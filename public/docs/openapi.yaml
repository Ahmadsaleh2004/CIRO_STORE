      summary: 'فحص صحّة التطبيق'
      description: "تُرجع 200 حين يكون التطبيق قادراً على خدمة الطلبات فعلاً، و503\nحين لا يكون. الفحص ينفّذ استعلاماً حقيقياً على قاعدة البيانات\nلا مجرّد ردّ ثابت — فحاوية تردّ 200 وقاعدتها ساقطة ليست سليمة.\n\nعامة بلا مصادقة بالضرورة: فاحص الصحّة لا يملك جلسة. ولذلك لا\nتكشف نسخاً ولا أسماء ولا مسارات — التفاصيل في السجلّ وحده."
      operationId: 0f6f4acf921ee6317a01dfda0e60a1ec
      responses:
        '200':
          description: 'التطبيق سليم.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok, enum: [ok] }
                  checks: { properties: { database: { type: string, example: ok } }, type: object }
                type: object
        '503':
          description: 'التطبيق غير قادر على خدمة الطلبات.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: fail, enum: [fail] }
                  checks: { properties: { database: { type: string, example: fail } }, type: object }
                type: object
