components:
  schemas:
    ApiResponse:
      title: 'غلاف استجابة JSON الموحّد'
      description: "الشكل الذي تُرجعه كل نقطة JSON في المشروع، من Controller::respond().\r\n\r\nكود HTTP يبقى 200 حتى عند الفشل. النتيجة تُقرأ من الحقل success لا\r\nمن كود الحالة. هذا سلوك قائم يعتمد عليه الـfrontend في 34 ملف JS."
      required:
        - success
        - message
      properties:
        success:
          description: 'مصدر الحقيقة الوحيد لنجاح العملية أو فشلها.'
          type: boolean
          example: true
        message:
          description: 'نصّ للعرض على المستخدم. لا تعتمد عليه برمجياً — راجع error_code.'
          type: string
          example: 'تمت العملية بنجاح.'
      type: object
    ApiError:
      title: 'استجابة فشل تحمل رمزاً صريحاً'
      description: "مثل ApiResponse لكن success=false ومعها error_code اختياري.\r\n\r\nالرمز عقد بين الخادم والمتصفح، والنصّ للعرض وحده. الفصل بينهما ليس\r\nتفضيلاً أسلوبياً: كان js/core/csrf.js يكتشف فشل CSRF بمطابقة بداية\r\nنصّ الرسالة، فأي نقطة تصوغ رسالتها بشكل آخر تفقد إعادة المحاولة\r\nالتلقائية بصمت. حدث ذلك ثلاث مرّات قبل أن يُستبدل النصّ برمز."
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Invalid CSRF token, please refresh and try again.'
        error_code:
          description: 'رمز ثابت تقرأه الآلة. يُضاف حين يحتاج العميل التصرّف لا العرض فقط.'
          type: string
          example: csrf_invalid
          enum:
            - csrf_invalid
      type: object
    Product:
