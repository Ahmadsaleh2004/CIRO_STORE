    Admin:
      title: 'حساب أدمن'
      description: "الرتب مرتّبة تماماً: A=4 أعلى من B=3 أعلى من C=2 أعلى من D=1.\r\n\r\nالقاعدة الحاكمة في AdminModel::canManageTarget هي «أكبر تماماً» لا\r\n«أكبر أو يساوي» — فلا يدير أدمنٌ رتبتَه. لو كانت الثانية لاستطاع كل\r\nأدمن حذف أقرانه، ومنهم من أضاف حسابه. ورتبة A تتجاوز كل الصلاحيات."
      properties:
