openapi: 3.0.0
info:
  title: 'Cairo Store API'
  description: "كل نقاط المتجر ولوحة التحكم.\r\n\r\nملاحظة عامة على الأخطاء: نقاط JSON في هذا المشروع تُرجع 200 حتى عند\r\nفشل التحقق، والنتيجة تُقرأ من الحقل success في الجسم لا من كود HTTP.\r\nالاستثناءات الوحيدة هي 302 (تحويل لتسجيل الدخول) و403 (صلاحية ناقصة)\r\nو404 (راوت غير موجود). هذا سلوك قائم يعتمد عليه الـfrontend، ووُثّق\r\nهنا كما هو لا كما ينبغي أن يكون."
  version: 1.1.0
servers:
  -
    url: 'http://localhost/STORE/public'
    description: 'Local / Development Server'
paths:
  /admin/settings:
    get:
      tags:
        - 'Admin - Site Settings'
      summary: 'عرض صفحة إعدادات الموقع الحالية'
      operationId: 634d1801e5ae45f856fbfc627b8bcd25
      responses:
        '200':
          description: 'صفحة HTML — يتطلب صلاحية can_edit_site_content'
        '302':
          description: 'إعادة توجيه لـ /admin/login'
        '403':
          description: 'ممنوع — لا يملك can_edit_site_content'
      security:
        -
          adminSessionAuth: []
    post:
      tags:
        - 'Admin - Site Settings'
      summary: 'حفظ إعدادات الموقع (AJAX) — الحقول المالية/العملة تُقبل فقط لصاحب can_manage_checkout_settings'
      description: "AdminSiteSettingsController — صفحة إعدادات الموقع للأدمن.\r\nيرث من AdminController الذي يتحقق من تسجيل دخول الأدمن تلقائياً."
      operationId: 3e053842fbd06f520e821e6726b6fe5f
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - csrf_token
              properties:
                csrf_token:
                  type: string
                footer_text:
                  type: string
                facebook_url:
                  type: string
                instagram_url:
                  type: string
                snapchat_url:
                  type: string
                whatsapp_number:
                  type: string
                tiktok_url:
                  type: string
                twitter_x_url:
                  type: string
                google_maps_url:
                  type: string
                copyright_text:
                  type: string
                phone_number:
                  type: string
                working_hours:
                  type: string
                employees_count:
                  type: integer
                site_url:
                  type: string
                return_policy:
                  type: string
                privacy_policy:
                  type: string
                terms_and_conditions:
                  type: string
                default_currency:
                  description: 'فقط لصاحب can_manage_checkout_settings'
                  type: string
                default_language:
                  description: 'فقط لصاحب can_manage_checkout_settings'
                  type: string
              type: object
      responses:
        '200':
          description: 'نجاح أو فشل الحفظ'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /about:
    get:
      tags:
        - 'Store - Pages'
      summary: 'صفحة "من نحن" — بيانات المتجر الثابتة مع عدد المنتجات المرئية'
      operationId: 6da6392c8a0f7198065416a7e1062f26
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '404':
          $ref: '#/components/responses/NotFoundPage'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/login:
    get:
      tags:
        - 'Admin - Auth'
      summary: 'عرض صفحة تسجيل دخول الأدمن'
      operationId: d3b445322ac83354e1501b04eeea68b7
      responses:
        '200':
          description: 'صفحة HTML لتسجيل الدخول'
    post:
      tags:
        - 'Admin - Auth'
      summary: 'تسجيل دخول الأدمن'
      operationId: f605c43a8e23a8d3a236178d7f5cf925
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - email
                - password
                - csrf_token
              properties:
                email:
                  description: 'البريد الإلكتروني للأدمن'
                  type: string
                  format: email
                password:
                  description: 'كلمة المرور'
                  type: string
                  format: password
                csrf_token:
                  description: 'CSRF token — مطلوب دائماً'
                  type: string
                h-captcha-response:
                  description: 'hCaptcha response — مطلوب بعد أول محاولة فاشلة'
                  type: string
              type: object
      responses:
        '200':
          description: 'نجاح أو فشل تسجيل الدخول'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  redirect: { description: 'موجود عند النجاح فقط', type: string }
                  show_captcha: { description: 'موجود عند الفشل — يعني يجب إظهار hCaptcha', type: boolean }
                  failed_attempts: { description: 'عدد المحاولات الفاشلة', type: integer }
                type: object
  /admin/login/2fa:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'الخطوة الثانية من دخول الأدمن — التحقق من رمز TOTP'
      description: 'تُستدعى بعد أن يُرجع /admin/login الحقل requires_2fa. الرمز من تطبيق مصادقة (Google Authenticator أو ما يماثله).'
      operationId: e7030ff592552764ee24f00281a3823c
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - code
                - csrf_token
              properties:
                code:
                  description: 'رمز TOTP من ستة أرقام'
                  type: string
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'نتيجة العملية. الحقل success يفصل النجاح عن الفشل — كود HTTP يبقى 200 في الحالتين. وعند فشل CSRF يحمل الجسم error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /admin/logout:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'تسجيل خروج الأدمن'
      operationId: 5bc6c0aaaefe4ef3e155d33f1085c096
      responses:
        '302':
          description: 'إعادة توجيه لـ /admin/login بعد تدمير الجلسة'
  /admin/forgot:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'طلب رابط إعادة تعيين كلمة مرور الأدمن'
      description: 'الرسالة المُرجَعة واحدة سواء وُجد البريد أم لا — كي لا تكشف النقطة أي البُرد مسجَّلة كأدمن.'
      operationId: 130cea99c5909844a7e4be7451bce9a8
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - email
                - csrf_token
              properties:
                email:
                  type: string
                  format: email
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'نتيجة العملية. الحقل success يفصل النجاح عن الفشل — كود HTTP يبقى 200 في الحالتين. وعند فشل CSRF يحمل الجسم error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /admin/store-mode/enter:
    post:
      tags:
        - 'Admin - Auth'
      summary: 'دخول الأدمن لوضع تصفح المتجر كزائر (Store Mode)'
      operationId: 6f56f79b4b92334c5dbcae224315b3f5
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - csrf_token
              properties:
                csrf_token:
                  description: 'CSRF token — مطلوب دائماً'
                  type: string
              type: object
      responses:
        '302':
          description: 'إعادة توجيه للمتجر / بعد تعيين وضع المتجر'
        '401':
          description: 'غير مسجّل دخول (AJAX/POST)'
  /admin/store-mode/reauth:
    get:
      tags:
        - 'Admin - Auth'
      summary: 'عرض صفحة إعادة التحقق بكلمة السر قبل الرجوع للوحة'
      operationId: 1e62213c6d5d92b4fdce0e924902f5aa
      responses:
        '200':
          description: 'صفحة HTML مستقلة لإعادة التحقق'
        '302':
          description: 'إعادة توجيه لـ /admin/home إن لم يكن الأدمن في وضع المتجر'
    post:
      tags:
        - 'Admin - Auth'
      summary: 'إعادة تحقق الأدمن بكلمة السر قبل الرجوع للوحة (JSON)'
      operationId: 64d4315e901132618b9471c6aeb5ec11
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - password
                - csrf_token
              properties:
                password:
                  description: 'كلمة مرور الأدمن'
                  type: string
                  format: password
                csrf_token:
                  description: 'CSRF token — مطلوب دائماً'
                  type: string
                return:
                  description: 'وجهة العودة (اختياري) — تُحمى ضد Open Redirect'
                  type: string
              type: object
      responses:
        '200':
          description: 'نجاح أو فشل التحقق'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  redirect: { description: 'موجود عند النجاح فقط', type: string }
                type: object
  /admin/csrf:
    get:
      tags:
        - 'Admin - Auth'
      summary: 'توليد CSRF token جديد لفورم الأدمن'
      operationId: 023c6f87e86c774e5c00533c18b0b90a
      responses:
        '200':
          description: 'توكن CSRF جديد'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean, example: true }
                  token: { description: 'CSRF token hex string', type: string }
                type: object
  /admin/branding:
    get:
      tags:
        - 'Admin - Branding'
      summary: 'عرض صفحة إدارة السلايدر'
      operationId: 04da49ab824daf342dfe454feda55cdb
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/RedirectToLogin'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        -
          adminSessionAuth: []
  /admin/branding/products/search:
    get:
      tags:
        - 'Admin - Branding'
      summary: 'بحث حي عن منتج لاختياره بالسلايدر (AJAX)'
      operationId: 185ea70d9c6ff55d56d576baa2b5d789
      parameters:
        -
          name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'نتيجة العملية. الحقل success يفصل النجاح عن الفشل — كود HTTP يبقى 200 في الحالتين. وعند فشل CSRF يحمل الجسم error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/branding/save:
    post:
      tags:
        - 'Admin - Branding'
      summary: 'حفظ كامل السلايدر (Full Replace) — شرائح + عناصر + رفع صور'
      operationId: 373a97f2a24a1dc606e7649ae9fca3a2
      requestBody:
        required: true
        content:
          multipart/form-data: {  }
      responses:
        '302':
          $ref: '#/components/responses/RedirectWithFlash'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/dashboard:
    get:
      tags:
        - 'Admin - Dashboard'
      summary: 'صفحة إحصائيات لوحة تحكم الأدمن (مبيعات، طلبات، مستخدمون، أفضل المنتجات مبيعًا)'
      operationId: 5a10c70d52102afac94342c298f09cad
      parameters:
        -
          name: q
          in: query
          description: 'بحث اختياري بالاسم ضمن قائمة أفضل المنتجات مبيعًا'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'صفحة HTML للداشبورد — يتطلب جلسة admin_session صالحة وصلاحية can_view_dashboard'
        '302':
          description: 'إعادة توجيه لـ /admin/login إذا لم تكن الجلسة صالحة'
        '403':
          description: 'ممنوع — الأدمن ليس لديه صلاحية can_view_dashboard'
      security:
        -
          adminSessionAuth: []
  /admin/home:
    get:
      tags:
        - 'Admin - Home'
      summary: 'صفحة لوحة التحكم الرئيسية'
      operationId: 5f2b0324a493fd085fc513c017fc963f
      responses:
        '200':
          description: 'صفحة HTML للوحة التحكم — يتطلب جلسة admin_session صالحة'
        '302':
          description: 'إعادة توجيه لـ /admin/login إذا لم تكن الجلسة صالحة'
      security:
        -
          adminSessionAuth: []
  /admin/admins:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'قائمة كل الأدمنية مع صلاحياتهم'
      operationId: 9159b1b855dae051e4af33f4dc0eff6d
      responses:
        '200':
          description: 'صفحة HTML بالجدول — يتطلب صلاحية can_manage_admins'
        '403':
          description: 'ممنوع — لا يملك can_manage_admins'
      security:
        -
          adminSessionAuth: []
  /admin/admins/add:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'عرض فورم إضافة أدمن جديد'
      operationId: 9eb0ffcb6b3931118276117fa7237887
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/RedirectToLogin'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        -
          adminSessionAuth: []
    post:
      tags:
        - 'Admin - Manage Admins'
      summary: 'إضافة أدمن جديد (يتطلب سبب + كلمة مرور الأدمن الحالي)'
      operationId: b2d4e525109310fa73bd53ed9159b66d
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - new_name
                - new_email
                - new_password
                - new_role
                - add_reason
                - confirm_current_pass
                - csrf_token
              properties:
                new_name:
                  type: string
                new_email:
                  description: 'يجب أن ينتهي بـ @gmail.com'
                  type: string
                  format: email
                new_phone:
                  type: string
                new_password:
                  type: string
                  format: password
                new_role:
                  description: 'A|B|C|D — يجب أن تكون أقل صراحة من رتبتك'
                  type: string
                perm_admins:
                  type: boolean
                perm_products:
                  type: boolean
                perm_users:
                  type: boolean
                perm_dashboard:
                  type: boolean
                perm_support:
                  type: boolean
                perm_content:
                  type: boolean
                perm_branding:
                  type: boolean
                perm_checkout:
                  type: boolean
                perm_orders:
                  type: boolean
                add_reason:
                  type: string
                confirm_current_pass:
                  type: string
                  format: password
                csrf_token:
                  type: string
              type: object
      responses:
        '302':
          $ref: '#/components/responses/RedirectWithFlash'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/admins/edit:
    post:
      tags:
        - 'Admin - Manage Admins'
      summary: 'حفظ تعديل رتبة/صلاحيات أدمن (يتطلب سبب + كلمة مرور الأدمن الحالي)'
      operationId: 23326486824d40055b9d9ed454b088d1
      responses:
        '302':
          $ref: '#/components/responses/RedirectWithFlash'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/admins/delete:
    post:
      tags:
        - 'Admin - Manage Admins'
      summary: 'حذف أدمن (AJAX — يرجع JSON، يتطلب سبب + كلمة مرور)'
      operationId: d63d8a22bfb1db8f2c0bfc8f806f9c80
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - target_id
                - delete_reason
                - confirm_del_pass
                - csrf_token
              properties:
                target_id:
                  type: integer
                delete_reason:
                  type: string
                confirm_del_pass:
                  type: string
                  format: password
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'نجاح أو فشل'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /admin/admins/details:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'تفاصيل أدمن معيّن: بياناته + نشاط طلباته + سجل أفعاله'
      operationId: 8b119ec8062bda0941bc4b18ad7dc779
      parameters:
        -
          name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '302':
          $ref: '#/components/responses/RedirectToLogin'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
        -
          adminSessionAuth: []
  /admin/admins/export-csv:
    get:
      tags:
        - 'Admin - Manage Admins'
      summary: 'تصدير قائمة الأدمنية كملف CSV — رتبة A فقط'
      operationId: 407baf53eac765c467db8fcdff2e886a
      responses:
        '200':
          $ref: '#/components/responses/CsvDownload'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
      security:
        -
          adminSessionAuth: []
  /admin/messaging/notify:
    post:
      tags:
        - 'Admin - Messaging'
      summary: 'إرسال رسالة فردية لأدمن أو يوزر (AJAX)'
      operationId: 73cc265efb790ccc50f0f6a1a6d839fb
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - target_type
                - target_id
                - title
                - message
                - csrf_token
              properties:
                target_type:
                  description: "'admin' أو 'user'"
                  type: string
                target_id:
                  type: integer
                title:
                  type: string
                message:
                  type: string
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /admin/messaging/broadcast:
    post:
      tags:
        - 'Admin - Messaging'
      summary: 'إرسال إشعار جماعي (AJAX) — أدمنية حسب الصلاحية + الرتبة، أو يوزرز حسب الحالة'
      operationId: 724f415bb841000f324c16023b863562
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - title
                - body
                - csrf_token
              properties:
                target_type:
                  description: "'admin' (صلاحيات + رتب) أو 'user' (حالات)"
                  type: string
                  enum: [admin, user]
                title:
                  type: string
                body:
                  type: string
                perms:
                  description: 'للأدمنية فقط'
                  type: array
                  items: { type: string }
                ranks:
                  description: 'للأدمنية فقط'
                  type: array
                  items: { type: string }
                statuses:
                  description: 'لليوزرز فقط'
                  type: array
                  items: { type: string, enum: [active, not_active, blocked] }
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: JSON
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  message: { type: string }
                type: object
      security:
        -
          adminSessionAuth: []
  /admin/my-info:
    get:
      tags:
        - 'Admin - My Info'
      summary: 'عرض صفحة معلوماتي الخاصة بالأدمن'
      operationId: 15738aa88d77264ebe6bd5f675809a65
      responses:
        '200':
          description: 'صفحة HTML لمعلومات الأدمن — يتطلب جلسة admin_session صالحة'
        '302':
