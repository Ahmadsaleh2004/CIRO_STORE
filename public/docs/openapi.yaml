                  type: integer
                variant_id:
                  type: integer
                qty:
                  type: integer
                  default: 1
                  maximum: 100
                  minimum: 1
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'JSON — {success, items, count}'
      security:
        -
          userSessionAuth: []
  /cart/update:
    post:
