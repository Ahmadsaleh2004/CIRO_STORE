            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { properties: { items: { description: 'One entry per requested variant_id. Deleted variants drop out of the result.', type: array, items: { $ref: '#/components/schemas/ProductVariant' } } }, type: object }
  /cart:
    get:
      tags:
