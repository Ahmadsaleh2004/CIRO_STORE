    CsrfToken:
      title: 'توكن CSRF'
      description: "مطلوب في كل نقطة POST عدا ثلاث موثّقة الاستثناء.\r\n\r\nيُقرأ من $_POST أو من جسم JSON معاً (Controller::requestData)، فيصحّ\r\nإرساله بأيّ من الشكلين. عند الفشل تُرجع النقطة error_code بقيمة\r\ncsrf_invalid، فيجلب js/core/csrf.js توكناً جديداً ويعيد المحاولة\r\nمرّة واحدة تلقائياً."
      type: string
      example: 3f2a9c1e8b7d6f5a4c3b2a190e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a291807
  responses:
    JsonSuccess:
      description: 'نجاح — success=true.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    HtmlPage:
      description: 'صفحة HTML كاملة.'
      content:
        text/html: {  }
    CsvDownload:
      description: 'ملف CSV للتحميل (Content-Disposition: attachment).'
      content:
        text/csv: {  }
    CsrfFailure:
      description: "فشل التحقق من توكن CSRF.\r\n\r\nكود HTTP يبقى 200 — الفشل يُقرأ من success=false ومن error_code.\r\nالعميل (js/core/csrf.js) يكتشف الرمز، يجلب توكناً جديداً، ويعيد\r\nالمحاولة مرّة واحدة تلقائياً. لذلك لا يرى المستخدم هذا الخطأ عادةً."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Invalid CSRF token, please refresh and try again.'
            error_code: csrf_invalid
    ValidationFailure:
      description: "مدخلات غير صالحة (حقل ناقص، بريد غير صحيح، رسالة أقصر من الحدّ…).\r\n\r\nكود HTTP يبقى 200 كبقية نقاط JSON؛ التمييز من success=false."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Message is too short (at least 10 characters).'
    MethodNotAllowed:
      description: 'الطلب لم يصل بـPOST. يُرفض في Controller::beginJsonPost قبل أي منطق.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Method not allowed.'
    SessionExpired:
      description: "لا جلسة صالحة. يُرجعها Middleware::requireAdmin لطلبات AJAX/POST\r\nبكود 401؛ أما طلبات الصفحات الكاملة فتُحوَّل بـ302 إلى صفحة الدخول."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Session expired. Please log in again.'
    PermissionDenied:
      description: "الجلسة صالحة لكن الصلاحية ناقصة (Middleware::requirePermission).\r\n\r\nرتبة A تتجاوز كل الصلاحيات، فلا تصل إلى هنا أبداً. والرسالة عامة\r\nعمداً: كشف اسم الصلاحية الناقصة للزائر يرسم له خريطة النظام."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Access denied. You do not have permission for this action.'
    NotFoundPage:
      description: 'راوت غير مسجَّل أو مورد غير موجود. صفحة HTML من ErrorPage::notFound.'
      content:
        text/html: {  }
    ServiceUnavailable:
      description: "عطل تقني يمنع إكمال الطلب — أبرزه فشل الاتصال بقاعدة البيانات.\r\n\r\n503 لا 500 عمداً: الخدمة غير متاحة مؤقتاً لا «خطأ في الخادم»،\r\nوالفرق يهمّ محرّكات البحث وأدوات المراقبة. التفاصيل تذهب إلى سجلّ\r\nالأخطاء ولا تُطبع للزائر أبداً — رسالة PDO تحمل اسم المضيف واسم\r\nالقاعدة واسم المستخدم."
      content:
        text/html: {  }
    RedirectToLogin:
      description: 'تحويل 302 إلى صفحة الدخول مع حفظ الوجهة الأصلية في الجلسة.'
      headers:
        Location:
          description: 'وجهة التحويل.'
          schema:
            type: string
    RedirectWithFlash:
      description: 'تحويل 302 مع رسالة flash في الجلسة تُعرَض في الصفحة التالية.'
      headers:
        Location:
          description: 'وجهة التحويل.'
          schema:
            type: string
  securitySchemes:
    adminSessionAuth:
      type: apiKey
      description: 'PHP session cookie — يُنشأ تلقائياً عند تسجيل الدخول ويُرسل مع كل طلب محمي'
      name: admin_session
      in: cookie
    userSessionAuth:
      type: apiKey
      description: "جلسة المستخدم العادي — منفصلة تماماً عن admin_session بالاسم\r\nوالمحتوى، فلا يمكن الوصول لبيانات الأدمن من جلسة مستخدم ولا العكس\r\n(راجع isUser/isAdmin في auth_helper.php)."
      name: PHPSESSID
      in: cookie
