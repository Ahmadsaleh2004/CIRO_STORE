  /checkout:
    get:
      tags:
        - 'Store - Checkout'
      summary: 'Checkout page (three steps)'
      operationId: 3c9e7f1f4ad315498f6c07de22b0082f
      responses:
        '200':
          description: 'HTML page'
        '302':
          description: 'Redirect home with the login modal opened when not signed in'
      security:
        -
          userSessionAuth: []
    post:
      tags:
        - 'Store - Checkout'
      summary: 'Create the order from the cart contents'
      description: 'The client sends **what and how many** and nothing else. Every monetary value is read from the database inside the same transaction that reserves stock. The shown_price field is compared and never stored: if it differs from the database price the whole order is refused and the server answers error_code=price_changed together with the correct prices.'
      operationId: b9a528bfe771ba04bed8dc5cf05bef51
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - items
                - address_id
                - idempotency_key
                - csrf_token
              properties:
                items:
                  type: array
                  items: { required: [product_id, qty], properties: { product_id: { type: integer }, variant_id: { type: integer, nullable: true }, qty: { type: integer, maximum: 100, minimum: 1 }, shown_price: { description: 'The price the customer was shown — for comparison only; never stored and never computed from', type: number, format: float } }, type: object }
                address_id:
                  type: integer
                payment_method:
                  type: string
                  default: cash_on_delivery
                idempotency_key:
                  type: string
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'Operation result. Success carries order_id and redirect. Failure carries an error_code out of: price_changed · unavailable · out_of_stock · error · csrf_invalid. Only price_changed additionally carries items with the correct prices.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
      security:
        -
          userSessionAuth: []
