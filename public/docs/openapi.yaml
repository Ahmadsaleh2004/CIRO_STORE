      summary: 'صفحة "اتصل بنا"'
      operationId: 2d03ed858c3066693769a44051ce6a34
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '404':
          $ref: '#/components/responses/NotFoundPage'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - 'Store - Pages'
      summary: 'إرسال نموذج "اتصل بنا" من الصفحة نفسها'
      description: "النقطة الوحيدة التي كانت مسجَّلة في الراوتر وغائبة عن المواصفة\r\n(103 من 104). وُثّقت هنا كما تعمل فعلاً.\r\n\r\nتختلف عن POST /contact/send اختلافاً جوهرياً: هذه **لا تُرجع\r\nJSON**. الدالة تخدم GET وPOST معاً، وتعيد عرض الصفحة كاملةً مع\r\nرسالة نجاح أو خطأ في متن HTML. ولهذا استُثنيت من beginJsonPost\r\nصراحةً — الفشل هنا لا يوقف التنفيذ بل يملأ $errorMsg ويُكمل.\r\n\r\nوفشل CSRF لا يُرجع error_code لأن لا عميل JS يقرأ هذه الاستجابة:\r\nالصفحة تُعرض والرسالة داخلها.\r\n\r\nشرطان للإرسال: مستخدم مسجّل الدخول (الزائر يُرفض)، ورسالة لا تقلّ\r\nعن عشرة محارف. والاسم والبريد يُقرآن من قاعدة البيانات لا من\r\nالطلب — تمريرهما في الجسم لا أثر له."
      operationId: f519ff2180ddfa32f78b30a2e4b9648c
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - send_message
                - message
                - csrf_token
              properties:
                send_message:
                  description: 'علامة وجود النموذج. بلا هذا المفتاح تُعرض الصفحة بلا معالجة.'
                  type: string
                  example: '1'
                message:
                  type: string
                  example: 'أرغب بالاستفسار عن توفّر المنتج باللون الأسود.'
                  minLength: 10
                csrf_token:
                  $ref: '#/components/schemas/CsrfToken'
              type: object
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
