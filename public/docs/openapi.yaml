components:
  schemas:
    ApiResponse:
      title: 'The unified JSON response envelope'
      description: "The shape every JSON endpoint in the project returns, from Controller::respond().\n\nThe HTTP status stays 200 even on failure. The outcome is read from the\n`success` field, not from the status code. This is existing behaviour that the\nfront end depends on across 34 JavaScript files."
      required:
        - success
        - message
      properties:
        success:
          description: 'The single source of truth for whether the operation succeeded.'
          type: boolean
          example: true
        message:
          description: 'Text to show the user. Do not depend on it programmatically — see error_code.'
          type: string
          example: 'The operation completed successfully.'
      type: object
    ApiError:
      title: 'A failure response carrying an explicit code'
      description: "Like ApiResponse, but with success=false and an optional error_code alongside.\n\nThe code is a contract between server and browser; the text is for display\nalone. Separating them is not a stylistic preference: js/core/csrf.js used to\ndetect a CSRF failure by matching the start of the message text, so any\nendpoint that worded its message differently lost the automatic retry, silently.\nThat happened three times before the text was replaced by a code."
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Invalid CSRF token, please refresh and try again.'
        error_code:
          description: 'A stable machine-readable code. Added when the client needs to act rather than merely display.'
          type: string
          example: csrf_invalid
          enum:
            - csrf_invalid
      type: object
    Product:
      title: Product
      description: 'A row from the products table. Prices are decimal(10,2) and arrive from PDO as strings.'
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: 'iPhone 16 Pro'
        name_ar:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        description_ar:
          type: string
          nullable: true
        country_of_origin:
          type: string
          example: USA
          nullable: true
        manufacturer:
          type: string
          example: Apple
          nullable: true
        price:
          type: string
          format: decimal
          example: '54999.00'
        discount_percentage:
          type: string
          format: decimal
          example: '10.00'
        price_after_discount:
          type: string
          format: decimal
          example: '49499.10'
          nullable: true
        gender_category:
          type: string
          enum:
            - male
            - female
            - both
        image_path:
          type: string
          nullable: true
        stock_quantity:
          description: 'The column is unsigned, so no negative value is possible. A threshold of 50 flips the badge to "limited".'
          type: integer
          example: 12
        sales_count:
          type: integer
          example: 130
        is_visible:
          type: boolean
          example: true
        date_added:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    ProductVariant:
      title: 'A colour variant of a product'
      description: 'A row from product_variants. Every product has exactly one default variant (is_default).'
      properties:
        id:
          type: integer
          example: 7
        product_id:
          type: integer
          example: 42
        color_name:
          type: string
          example: 'Black Titanium'
        color_hex:
          type: string
          example: '#2f2f31'
          nullable: true
        price:
          type: string
          format: decimal
          example: '54999.00'
        discount_percentage:
          type: string
          format: decimal
          example: '0.00'
        price_after_discount:
          type: string
          format: decimal
          nullable: true
        stock_quantity:
          type: integer
          example: 5
        gender_category:
          type: string
          enum:
            - male
            - female
            - both
        image_path:
          type: string
          nullable: true
        is_default:
          type: boolean
          example: true
        sort_order:
          type: integer
          example: 0
      type: object
    Category:
      title: Category
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Smartphones
      type: object
    StockBadge:
      title: 'Stock badge'
      description: "The output of getStockBadge() in app/helpers/stock_badge_helper.php.\n\nThe function has a mirror in JavaScript (stockBadge in js/core/utils.js) that\nserves the cards the browser builds. The threshold of 50 and the label strings\nare duplicated across the two languages deliberately, in a project with no\nbuild step. A null means \"no badge\" — plentiful stock in a context that does\nnot call for a green one."
      properties:
        label:
          type: string
          example: 'Limited (7 left)'
        class:
          type: string
          example: 'bg-warning text-dark'
      type: object
      nullable: true
    OrderItem:
      title: 'An order line'
      description: 'The price is stored at purchase time rather than read from the product — changing a product price later does not touch a completed order.'
      properties:
        id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
          nullable: true
        variant_id:
          type: integer
          nullable: true
        quantity:
          type: integer
          example: 2
        unit_price:
          type: string
          format: decimal
          example: '54999.00'
      type: object
    Order:
      title: Order
      properties:
        id:
          type: integer
          example: 1024
        user_id:
          type: integer
          nullable: true
        status:
          description: 'The order status. Transitions are governed in OrderModel, inside transactions.'
          type: string
          example: pending
        total_price:
          type: string
          format: decimal
          example: '109998.00'
        taken_by_admin_id:
          description: 'The admin holding it. Released automatically once the deadline passes (order_expiry_log).'
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    Address:
      title: 'A user address'
      properties:
        id:
          type: integer
        user_id:
          type: integer
        address_line:
          type: string
        city:
          type: string
          nullable: true
        phone:
          type: string
          example: '+201234567890'
          nullable: true
      type: object
    User:
      title: 'Store user'
      description: 'The password field never appears in any response.'
      properties:
        id:
          type: integer
          example: 88
        full_name:
          type: string
        email:
          type: string
          format: email
          example: user@example.com
        phone_number:
          type: string
          nullable: true
        is_blocked:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
      type: object
    Admin:
      title: 'Admin account'
      description: "The ranks are totally ordered: A=4 outranks B=3 outranks C=2 outranks D=1.\n\nThe governing rule in AdminModel::canManageTarget is \"strictly greater\", not\n\"greater than or equal\" — so no admin manages their own rank. Were it the\nlatter, every admin could delete their peers, among them whoever created their\naccount. Rank A overrides every permission."
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: 'Root Admin'
        email:
          type: string
          format: email
        role:
          type: string
          example: B
          enum:
            - A
            - B
            - C
            - D
        totp_enabled:
          type: boolean
          example: true
        phone_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    AdminPermissions:
      title: 'Admin permissions'
      description: 'A row from admin_permissions. Rank A overrides all of them in hasPermission().'
      properties:
        can_manage_admins:
          type: boolean
        can_manage_products:
          type: boolean
        can_manage_users:
          type: boolean
        can_view_dashboard:
          type: boolean
        can_manage_support:
          type: boolean
        can_edit_site_content:
          type: boolean
        can_manage_checkout_settings:
          type: boolean
        can_manage_orders:
          type: boolean
        can_manage_branding:
          type: boolean
      type: object
    Notification:
      title: Notification
      properties:
        id:
          type: integer
        title:
          type: string
          example: 'Order Taken'
        message:
          type: string
        is_read:
          type: boolean
          example: false
        related_type:
          type: string
          example: order
          nullable: true
        related_id:
          type: integer
          example: 1024
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
    SupportMessage:
      title: 'Support message'
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        full_name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
        created_at:
          type: string
          format: date-time
      type: object
    SliderItem:
      title: 'A slider slide'
      properties:
        id:
          type: integer
        slider_id:
          type: integer
        product_id:
          type: integer
          nullable: true
        image_path:
          type: string
          nullable: true
        sort_order:
          type: integer
      type: object
    CsrfToken:
      title: 'CSRF token'
      description: "Required on every POST endpoint except three whose exemption is documented.\n\nIt is read from $_POST and from a JSON body alike (Controller::requestData), so\nsending it in either form is valid. On failure the endpoint returns error_code\nwith the value csrf_invalid, and js/core/csrf.js fetches a fresh token and\nretries exactly once, automatically."
      type: string
      example: 3f2a9c1e8b7d6f5a4c3b2a190e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a291807
  responses:
    JsonSuccess:
      description: 'Success — success=true.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    HtmlPage:
      description: 'A complete HTML page.'
      content:
        text/html: {  }
    CsvDownload:
      description: 'A CSV file for download (Content-Disposition: attachment).'
      content:
        text/csv: {  }
    CsrfFailure:
      description: "CSRF token validation failed.\n\nThe HTTP status stays 200 — the failure is read from success=false and from\nerror_code. The client (js/core/csrf.js) detects the code, fetches a fresh\ntoken, and retries exactly once, automatically. Which is why the user does not\nnormally see this error at all."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Invalid CSRF token, please refresh and try again.'
            error_code: csrf_invalid
    ValidationFailure:
      description: "Invalid input (a missing field, a malformed email, a message below the minimum length…).\n\nThe HTTP status stays 200 as on every other JSON endpoint; the distinction comes from success=false."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Message is too short (at least 10 characters).'
    MethodNotAllowed:
      description: 'The request did not arrive as a POST. Refused in Controller::beginJsonPost before any logic runs.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Method not allowed.'
    SessionExpired:
      description: "No valid session. Middleware::requireAdmin returns this with a 401 for\nAJAX/POST requests; full page requests are redirected to the sign-in page with\na 302 instead."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Session expired. Please log in again.'
    PermissionDenied:
      description: "The session is valid but the permission is missing (Middleware::requirePermission).\n\nRank A overrides every permission, so it never reaches here. The message is\ndeliberately generic: naming the missing permission would draw the caller a map\nof the system."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            message: 'Access denied. You do not have permission for this action.'
    NotFoundPage:
      description: 'An unregistered route or a missing resource. An HTML page from ErrorPage::notFound.'
      content:
        text/html: {  }
    ServiceUnavailable:
      description: "A technical fault preventing the request from completing — most often a failed database connection.\n\n503 rather than 500, deliberately: the service is temporarily unavailable, not\n\"a server error\", and the difference matters to search engines and monitoring\ntools. The details go to the error log and are never printed to the visitor — a\nPDO message carries the host name, the database name and the user name."
      content:
        text/html: {  }
    RedirectToLogin:
      description: 'A 302 redirect to the sign-in page, with the original destination kept in the session.'
      headers:
        Location:
          description: 'The redirect destination.'
          schema:
            type: string
    RedirectWithFlash:
      description: 'A 302 redirect with a flash message in the session, shown on the next page.'
      headers:
        Location:
          description: 'The redirect destination.'
          schema:
            type: string
  securitySchemes:
    adminSessionAuth:
      type: apiKey
      description: 'PHP session cookie — created automatically at sign-in and sent with every protected request'
      name: admin_session
      in: cookie
    userSessionAuth:
      type: apiKey
      description: "The regular user session — entirely separate from admin_session in both name\nand contents, so admin data cannot be reached from a user session or the other\nway round (see isUser/isAdmin in auth_helper.php)."
      name: PHPSESSID
      in: cookie
tags:
  -
