  /contact:
    get:
      tags:
        - 'Store - Pages'
      summary: 'Contact page'
      operationId: 2d03ed858c3066693769a44051ce6a34
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '404':
          $ref: '#/components/responses/NotFoundPage'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - 'Store - Pages'
      summary: 'Submit the contact form from the page itself'
      description: "The one endpoint that was registered in the router and missing from the\nspec (103 of 104). Documented here as it actually behaves.\n\nIt differs from POST /contact/send in a fundamental way: this one **does\nnot return JSON**. The method serves both GET and POST, and re-renders the\nwhole page with a success or error message inside the HTML body. That is\nwhy it is deliberately excluded from beginJsonPost — a failure here does\nnot halt execution, it fills $errorMsg and carries on.\n\nA CSRF failure returns no error_code either, because no JavaScript client\nreads this response: the page is rendered with the message inside it.\n\nTwo conditions to send: a logged-in user (a visitor is refused), and a\nmessage of at least ten characters. The name and email are read from the\ndatabase, not from the request — passing them in the body has no effect."
      operationId: f519ff2180ddfa32f78b30a2e4b9648c
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - send_message
                - message
                - csrf_token
              properties:
                send_message:
                  description: 'Marks the form as present. Without this key the page renders with no processing.'
                  type: string
                  example: '1'
                message:
                  type: string
                  example: 'I would like to ask whether this product is available in black.'
                  minLength: 10
                csrf_token:
                  $ref: '#/components/schemas/CsrfToken'
              type: object
      responses:
        '200':
          $ref: '#/components/responses/HtmlPage'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /contact/send:
    post:
      tags:
        - 'Store - Pages'
      summary: 'Send a message from the contact form'
      operationId: da9e99ecb7f2081457a4e5acaaf9d2f2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - name
                - email
                - message
                - csrf_token
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                message:
                  type: string
                csrf_token:
                  type: string
              type: object
      responses:
        '200':
          description: 'Operation result. The success field separates success from failure — the HTTP status stays 200 either way. On CSRF failure the body carries error_code=csrf_invalid.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ApiResponse' }
                  - { $ref: '#/components/schemas/ApiError' }
  /health:
    get:
      tags:
        - 'Store - Pages'
      summary: 'Application health check'
      description: "Returns 200 when the application can actually serve requests, and 503\nwhen it cannot. The check runs a real database query rather than a\ncanned response — a container that answers 200 while its database is\ndown is not healthy.\n\nPublic and unauthenticated of necessity: a health prober has no\nsession. For that reason it exposes no versions, no names and no\npaths — details go to the log alone."
      operationId: 0f6f4acf921ee6317a01dfda0e60a1ec
      responses:
        '200':
          description: 'The application is healthy.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: ok, enum: [ok] }
                  checks: { properties: { database: { type: string, example: ok } }, type: object }
                type: object
        '503':
          description: 'The application cannot serve requests.'
          content:
            application/json:
              schema:
                properties:
                  status: { type: string, example: fail, enum: [fail] }
                  checks: { properties: { database: { type: string, example: fail } }, type: object }
                type: object
