# ══════════════════════════════════════════════════════════════
# Local semgrep rules — Cairo Store
# ══════════════════════════════════════════════════════════════
#
# Why local rules when `--config auto` runs 1074 general ones?
#
# Because **the four most serious faults in this project were never caught by a general
# rule**: an audit log lying about a deletion that never happened · a checkout page outside
# the CSRF net · a blank page of raw text disclosing the permission rule · and a delete path
# that escapes public/. All of them were found by reading, and fixed in that session.
#
# The rules below encode those particular faults. And every one is **proven against the
# broken version in history**: it fires on the code before the fix and falls silent after
# it. A rule that cannot be proven that way is not added — because it may never catch
# anything and gives reassurance without cause.
#
# And they need neither a network nor an account: `semgrep --config .semgrep/` runs locally.
#
# ── Adding one ───────────────────────────────────────────────
# Add a rule here **after** a real fault occurs, not before. The test: would it have caught
# a fault that actually happened? If not, it is noise.

rules:

  # ════════════════════════════════════════════════════════════
  # 1. A raw die() in a controller
  # ════════════════════════════════════════════════════════════
  #
  # The real fault: `BackupController` and `AdminManageAdminsController` replied with
  # `die('Unauthorized — Root admin only (ID=1)')` — a 39-byte response body with no <head>,
  # no layout and no way back, **and it discloses the permission rule** to somebody who does
  # not hold it.
  #
  # Worse still: two of the five were **JSON endpoints**, so the JavaScript received a
  # `text/html` reply and showed "Network error" instead of the real reason.
  #
  # The alternative: ErrorPage::forbidden() for pages, and $this->respond() for endpoints.
  - id: cairo-raw-die-in-controller
    languages: [php]
    severity: ERROR
    message: >-
      A die()/exit() reply of raw text in a controller: a blank page with no layout and no
      way back, and it may disclose the permission rule. Use ErrorPage::forbidden() or
      ErrorPage::notFound() for pages, and $this->respond(false, ...) for JSON endpoints.
    paths:
      include:
        - "/app/Controllers/*.php"
    patterns:
      - pattern-either:
          - pattern: die("...")
          - pattern: exit("...")

  # ════════════════════════════════════════════════════════════
  # 2. unlink() on a path that was never contained
  # ════════════════════════════════════════════════════════════
  #
  # The real fault: `AdminProductsController` built the delete path as
  # `ROOTPATH . '/public/' . ltrim($oldPath, '/')`. And `ltrim` strips the leading slashes
  # **without preventing `..`** — so a value of `../.env` resolved to the real secrets file,
  # and `@unlink` would have deleted it.
  #
  # The three safe paths in the project: publicFileToDelete (a contained realpath) ·
  # getBackupPath (basename + a pattern + is_file) · basename().
  - id: cairo-unlink-unvalidated-path
    languages: [php]
    severity: ERROR
    message: >-
      unlink() on a path that passed no containment guard. ltrim() does not prevent "..".
      Pass the path through publicFileToDelete(), basename() or
      BackupModel::getBackupPath() before deleting.
    paths:
      include:
        - "/app/**/*.php"
    patterns:
      - pattern: unlink($PATH)
      - pattern-not: unlink(publicFileToDelete(...))
      - pattern-not: unlink($X . basename(...))
      - pattern-not: unlink(basename(...))
      # The ternary form: $disk = $x ? publicFileToDelete($x) : null;
      - pattern-not-inside: |
          $PATH = $COND ? publicFileToDelete(...) : null;
          ...
      # A variable assigned from a known guard before the line
      - pattern-not-inside: |
          $PATH = publicFileToDelete(...);
          ...
      - pattern-not-inside: |
          $PATH = $X . DIRECTORY_SEPARATOR . basename(...);
          ...
      - pattern-not-inside: |
          $PATH = self::getBackupPath(...);
          ...
      - pattern-not-inside: |
          $PATH = BackupModel::getBackupPath(...);
          ...
      - pattern-not-inside: |
          $PATH = tempnam(...);
          ...

  # ════════════════════════════════════════════════════════════
  # 3. return true after execute() with no rowCount check
  # ════════════════════════════════════════════════════════════
  #
  # The real fault: `AdminProductModel::delete` returned `true` unconditionally. And
  # `DELETE ... WHERE id = ?` on a non-existent id **succeeds** and deletes zero rows. So
  # the endpoint answered "Product deleted successfully" for a product that did not exist,
  # **and wrote an audit row and a notification claiming a deletion that never happened**.
  #
  # The audit log is the last thing allowed to lie — it is the record consulted when
  # somebody asks "who deleted what, and when".
  - id: cairo-execute-then-return-true
    languages: [php]
    severity: WARNING
    message: >-
      return true straight after execute() with no rowCount() check. A DELETE/UPDATE on a
      non-existent id succeeds and affects zero rows, so the function returns "succeeded"
      for an operation that never happened. Check $stmt->rowCount() and distinguish "not
      found" from "a technical failure".
    paths:
      include:
        - "/app/Models/*.php"
    patterns:
      # The "=~/…/" form inside a pattern is not valid in semgrep — filtering on a
      # metavariable's value is done with a separate metavariable-regex.
      - pattern: |
          $DB->prepare($SQL)->execute(...);
          ...
          return true;
      - metavariable-regex:
          metavariable: $SQL
          regex: (?i).*(DELETE|UPDATE)\s.*
      # ⚠️ There used to be no exception for rowCount here, on the theory that "the chained
      # form is itself the smell": fixing a function means splitting `$stmt = prepare();
      # $stmt->execute();` so rowCount can be read off $stmt, and the split no longer
      # matches the pattern above.
      #
      # The theory holds for a function with **one** statement and breaks for every one
      # with several. The pattern matches a *range* — any chained execute, then anything,
      # then `return true` — so a transaction that clears its child rows before deleting
      # the parent produces one match per cleanup statement, no matter how carefully the
      # parent delete is checked.
      #
      # Measured, not assumed. After AdminModel::deleteAdmin and
      # CategoryModel::deleteAndReassign were genuinely fixed, five findings remained — and
      # one of them was **AdminProductModel::delete**, the very function this rule exists to
      # protect, with its `if ($stmt->rowCount() === 0)` visible inside the reported range.
      # A rule that flags its own reference fix is not strict, it is imprecise, and the cost
      # is the one this repository already wrote down: "a gate that blocks every push is
      # worked around within two days, which makes it worse than its absence".
      #
      # So the exception is scoped to the path between the statement and the return: if
      # rowCount is consulted anywhere along it, the function is not returning true blindly,
      # which is the whole claim in the message above. A function that checks one statement
      # and not another is out of this rule's reach by design — catching that needs
      # dataflow, and a rule that reports its own fixes catches nothing at all in practice.
      #
      # It is written as a range rather than `pattern-not-inside: function $F(...) {...}`
      # because semgrep's PHP parser rejects that form outright:
      #     [ERROR] Invalid pattern for PHP: Stdlib.Parsing.Parse_error
      # A bare `$STMT->rowCount()` on its own line is rejected for the same reason — it is
      # an expression where a statement is required. The `if` with `<... ...>` around the
      # call is what parses, and the deep-expression operator is not decoration: it makes
      # the exception match any shape of the check rather than one spelling. Proven on a
      # fixture carrying all three that occur in practice — `=== 0`, `!$stmt->rowCount()`
      # and `< 1` — against a deliberately unchecked delete that still fires.
      - pattern-not: |
          $DB->prepare($SQL)->execute(...);
          ...
          if (<... $STMT->rowCount() ...>) { ... }
          ...
          return true;

  # ════════════════════════════════════════════════════════════
  # 4. A POST fetch() outside the CSRF safety net
  # ════════════════════════════════════════════════════════════
  #
  # The real fault: `features/checkout.js` sent both checkout endpoints through a local
  # wrapper with no retry. And the token in this project is **one per session**, so a form
  # failing in another tab is enough to invalidate the checkout page's token — losing a
  # purchase after three completed steps.
  #
  # And the file escaped the phase-6 inventory because it passes the method in a variable,
  # so a search for `method: 'POST'` did not match it.
  #
  # ⚠️ Five endpoints use a bare fetch **rightly**, because the server does not verify CSRF
  # on them (the two sign-out endpoints · check-stock · the category suggestions · the admin
  # sign-in). Each is documented in place with a comment beginning "a deliberately bare
  # fetch", and exempted with // nosemgrep where needed.
  - id: cairo-bare-fetch-post
    languages: [js]
    severity: WARNING
    message: >-
      A POST fetch() outside fetchWithCsrfRetry. The token is one per session in this
      project, so any rotation of it invalidates the token on every open page and loses the
      request. Use fetchWithCsrfRetry, or document the reason above the line if the endpoint
      does not verify CSRF at all.
    paths:
      include:
        - "/public/js/**/*.js"
    patterns:
      - pattern-either:
          # The quoting is required: the pattern contains ": " so YAML reads it as a map
          - pattern: 'fetch($URL, {..., method: "POST", ...})'
          - pattern: "fetch($URL, {..., method: 'POST', ...})"
          # ⚠️ The shorthand `method,` form — which is **exactly** what let checkout.js
          # escape the phase-6 inventory: the search was for `method: 'POST'` and did not
          # match a variable being passed. A rule blind to this form repeats that same
          # blindness.
          - pattern: 'fetch($URL, {..., method: $M, ...})'
      # Read requests need no token
      - pattern-not: 'fetch($URL, {..., method: "GET", ...})'
      - pattern-not: "fetch($URL, {..., method: 'GET', ...})"

  # ════════════════════════════════════════════════════════════════
  # 5) Detecting a CSRF failure by the message's text rather than error_code
  # ════════════════════════════════════════════════════════════════
  # This fault occurred three times in this project before it was fixed at the root:
  # WishlistController::notify replied with 'Invalid session…' and ContactController::send
  # with 'Invalid request…', so fetchWithCsrfRetry did not recognise the failure and did not
  # retry — and those two buttons failed outright where every other button recovered
  # silently. Six further endpoints survived by luck alone, because their wording happened to
  # begin with the same prefix.
  #
  # Today's contract: {error_code: 'csrf_invalid'} from respondCsrfFailure().
  # Any return to matching on the text brings the fault back, and it will show up only for a
  # user whose token has expired.
  - id: cairo-csrf-detect-by-message
    languages: [js]
    severity: ERROR
    message: >-
      Detecting a CSRF failure by the message's text. The message is display text that
      changes freely; the contract is error_code === 'csrf_invalid', sent by
      Controller::respondCsrfFailure(). Matching on the text breaks silently at the first
      rewording — and it did break three endpoints in this project.
    paths:
      include:
        - "/public/js/**/*.js"
    patterns:
      - pattern-either:
          - pattern: $D.message.startsWith("Invalid CSRF ...")
          - pattern: $D.message.includes("Invalid CSRF ...")
          - pattern: $D.message === "Invalid CSRF ..."

  # ════════════════════════════════════════════════════════════════
  # 6) A JSON endpoint that changes state with no CSRF check
  # ════════════════════════════════════════════════════════════════
  # NotificationController had its own requireAuth() and requirePost() and zero
  # verifyCsrfToken in the whole file — so it looked protected while it was not.
  # /notifications/delete-all deleted all of a user's notifications from any origin.
  #
  # The rule catches the pattern: a public function in a controller that sets the JSON
  # header and calls neither beginJsonPost nor verifyCsrfToken. The legitimate exceptions (a
  # read on GET, a page that redirects) are documented with a nosemgrep above the line.
  - id: cairo-json-endpoint-without-csrf
    languages: [php]
    severity: WARNING
    message: >-
      An endpoint that sets the JSON header with neither beginJsonPost() nor
      verifyCsrfToken(). If it changes state it is open to CSRF. Use beginJsonPost(), or
      document the reason with a nosemgrep if it is a pure read on GET.
    paths:
      include:
        - "/app/Controllers/*.php"
    # The pattern matches **the whole function**, not the header line alone. The first
    # attempt used pattern-inside for the function with pattern-not-inside for the guard,
    # and semgrep did not bind $F across the two conditions, producing 11 results most of
    # them false (login and reauth do call verifyCsrfToken). Matching the whole function and
    # then excluding it with pattern-not keeps the scope one rather than two.
    patterns:
      - pattern: |
          public function $F(...) {
            ...
            header('Content-Type: application/json; charset=utf-8');
            ...
          }
      - pattern-not: |
          public function $F(...) {
            ...
            $this->beginJsonPost(...);
            ...
          }
      # In this project the call always sits inside an `if (!verifyCsrfToken(...))`
      # condition rather than as a standalone statement, so a statement pattern alone does
      # not match it.
      - pattern-not: |
          public function $F(...) {
            ...
            if (!verifyCsrfToken(...)) { ... }
            ...
          }
      # ── Named exceptions ──────────────────────────────────────────
      # Seven endpoints rightly set the JSON header without a token, and all of them read
      # rather than change state. They are excepted here and not with a nosemgrep comment
      # above each one: the rule's match starts at the #[OA\...] attribute block rather than
      # at the header line, so the comment would have to sit above the whole attribute — a
      # fragile spot that the first person to "tidy" the file would displace. The list here
      # is seen by a reviewer all at once.
      #
      #   getCsrf        — fetching the token itself; it cannot require a token
      #   list           — reading notifications on GET (the user's and the admin's)
      #   searchProducts — a read-only search on GET
      #   stock          — a public stock query on GET
      #   checkStock     — a stock query on POST (a long list of ids), which changes no
      #                    state and carries no token in the first place
      - pattern-not: |
          public function getCsrf(...) { ... }
      - pattern-not: |
          public function list(...) { ... }
      - pattern-not: |
          public function searchProducts(...) { ... }
      - pattern-not: |
          public function stock(...) { ... }
      - pattern-not: |
          public function checkStock(...) { ... }
