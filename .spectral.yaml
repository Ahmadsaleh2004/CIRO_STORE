# ══════════════════════════════════════════════════════════════
# Linting the OpenAPI specification — Cairo Store
# ══════════════════════════════════════════════════════════════
#
# Run in CI over public/docs/openapi.yaml:
#     npx @stoplight/spectral-cli lint public/docs/openapi.yaml
#
# Why lint the specification at all? Because it is generated from PHP attributes, so an
# error in it shows up only to somebody opening the /docs page — and nobody may do that for
# months. Linting makes a broken specification fail the build rather than wait for a
# discoverer.

extends: ["spectral:oas"]

rules:
  # ── Rules raised to error ───────────────────────────────────

  # A broken reference means a field whose shape the specification's reader cannot know. The
  # worst thing that can happen to a specification resting on 128 references.
  oas3-valid-schema-example: error
  oas3-schema: error

  # ── Rules switched off, each with its reason ────────────────

  # Every one of the 109 operations carries a `summary`; only 28 add a longer `description`
  # on top of it. So the rule would produce 81 warnings asking for a second sentence where
  # one already says what the operation does — a demand about documentation style, not a
  # fault. (Measured: enabling it as a warning gives exactly 81 findings.)
  oas3-api-servers: warn
  operation-description: off
  info-contact: off
  info-license: off

  # The tags are described in openapi_info.php rather than on every operation.
  operation-tag-defined: warn

  # The operation ids are generated from the function names, which guarantees their
  # uniqueness.
  operation-operationId-unique: error
  operation-operationId: warn

# ── A note on the 4xx rule ────────────────────────────────────
#
# There is no rule here requiring every operation to have a 4xx response, and that is
# deliberate.
#
# The JSON endpoints in this project return **200 even on failure**, and the outcome is read
# from the success field rather than from the HTTP code. That is existing behaviour, relied
# on by the front end across 34 JS files, and changing it is a breaking change rather than a
# documentation matter. So such a rule would fail on every JSON endpoint — that is, it would
# be describing some other API than this one.
#
# And the specification describes what exists rather than what ought to. When the endpoints
# are moved to real HTTP codes, the rule is added in that same commit.
#
# ⚠️ It was tried here under the name `operation-4xx-response` and spectral rejected it:
# "Cannot extend non-existing rule" — the name is not part of the spectral:oas set. The
# justification stayed a comment rather than a disabled rule that does not exist.

# ── The "unused component" warnings — 15 today ───────────────
#
# They are neither errors nor noise: they are **an explicit to-do list**.
#
# The schema vocabulary was built out in full (Product, Order, User, Admin…) but the
# operations returning those entities still describe their responses with the generic
# ApiResponse wrapper alone. Wiring every operation to its entity's schema is the next
# increment, and these warnings will then disappear one by one.
#
# They are left visible on purpose rather than switching the rule off: a schema defined with
# no user is dead documentation, and hiding the indicator does not revive it.
