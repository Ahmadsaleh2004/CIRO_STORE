# ══════════════════════════════════════════════════════════════
# فحص مواصفة OpenAPI — Cairo Store
# ══════════════════════════════════════════════════════════════
#
# يُشغَّل في CI على public/docs/openapi.yaml:
#     npx @stoplight/spectral-cli lint public/docs/openapi.yaml
#
# لماذا فحص للمواصفة أصلاً؟ لأنها مولَّدة من سمات PHP، فالخطأ فيها لا
# يظهر إلا لمن يفتح صفحة /docs — وقد لا يفعل أحد لأشهر. الفحص يجعل
# مواصفة مكسورة تُفشل البناء لا تنتظر مكتشفاً.

extends: ["spectral:oas"]

rules:
  # ── قواعد مرفوعة إلى خطأ ────────────────────────────────────

  # مرجع مكسور يعني حقلاً لا يعرف قارئ المواصفة شكله. أخطر ما يمكن أن
  # يحدث لمواصفة تعتمد على 128 مرجعاً.
  oas3-valid-schema-example: error
  oas3-schema: error

  # ── قواعد مطفأة، ولكل واحدة سببها ───────────────────────────

  # الوصف الإنجليزي غير مطلوب: توثيق هذا المشروع عربي بالكامل، وقاعدة
  # «الجملة تبدأ بحرف كبير» بلا معنى في نصّ عربي.
  oas3-api-servers: warn
  operation-description: off
  info-contact: off
  info-license: off

  # الوسوم موصوفة في openapi_info.php لا في كل عملية.
  operation-tag-defined: warn

  # معرّفات العمليات مولَّدة من أسماء الدوال، وتفرّدها مضمون بذلك.
  operation-operationId-unique: error
  operation-operationId: warn

# ── ملاحظة على قاعدة 4xx ──────────────────────────────────────
#
# لا توجد هنا قاعدة تطالب كل عملية بردّ 4xx، وهذا مقصود.
#
# نقاط JSON في هذا المشروع تُرجع **200 حتى عند الفشل**، والنتيجة تُقرأ
# من الحقل success لا من كود HTTP. سلوك قائم يعتمد عليه الـfrontend في
# 34 ملف JS، وتغييره تغييرٌ كاسر لا مسألة توثيق. فقاعدة كهذه كانت
# ستفشل على كل نقطة JSON — أي أنها تصف واجهة أخرى غير هذه.
#
# والمواصفة تصف ما هو كائن لا ما ينبغي أن يكون. حين تُحوَّل النقاط إلى
# أكواد HTTP حقيقية تُضاف القاعدة في الالتزام نفسه.
#
# ⚠️ جُرّب وضعها هنا باسم `operation-4xx-response` فرفضها spectral:
# «Cannot extend non-existing rule» — الاسم ليس من مجموعة spectral:oas.
# التبرير بقي تعليقاً بدل قاعدة معطّلة لا وجود لها.

# ── تحذيرات «مكوّن غير مستعمل» — 15 اليوم ────────────────────
#
# ليست أخطاءً وليست ضجيجاً: هي **قائمة عمل صريحة**.
#
# مفردات المخططات بُنيت كاملة (Product، Order، User، Admin…) لكن
# العمليات التي تُرجع هذه الكيانات ما زالت تصف استجاباتها بالغلاف العام
# ApiResponse وحده. ربط كل عملية بمخطّط كيانها هو الزيادة التالية،
# وحينها تختفي هذه التحذيرات واحداً واحداً.
#
# تُركت ظاهرة عمداً بدل إطفاء القاعدة: مخطّط مُعرَّف بلا مستعمل توثيق
# ميّت، وإخفاء المؤشّر عليه لا يُحييه.
