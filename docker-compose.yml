# ══════════════════════════════════════════════════════════════
# Cairo Store — a reproducible environment
# ══════════════════════════════════════════════════════════════
#
# Before this file, running the project required a particular version of XAMPP, at a
# particular path (/STORE/public was written explicitly in config.php), with a database
# built by hand. Which is to say "run it on your machine" was a set of instructions rather
# than a command.
#
#     docker compose up -d
#     docker compose exec app php scripts/migrate.php baseline
#
# And nothing else.

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      APP_NAME: "Cairo Store"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-ciro_db}"
      DB_USERNAME: "${DB_USERNAME:-cairo}"
      DB_PASSWORD: "${DB_PASSWORD:-cairo}"
    volumes:
      # The uploaded images and the backups live outside the container: a rebuild wipes its
      # file system, and the admin's products are not part of the image.
      - uploads:/var/www/html/public/images
      - backups:/var/www/html/storage/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ciro_db}"
      MYSQL_USER: "${DB_USERNAME:-cairo}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-cairo}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - dbdata:/var/lib/mysql
      # The reference schema is loaded automatically on the first run alone. The
      # docker-entrypoint-initdb.d directory is ignored once the database is built — so
      # there is no risk to existing data.
      - ./tests/fixtures/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # The check runs as the ordinary user rather than root: its success means the
      # permissions really are ready, not merely that the server responds.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME:-cairo}", "-p${DB_PASSWORD:-cairo}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
  backups:
