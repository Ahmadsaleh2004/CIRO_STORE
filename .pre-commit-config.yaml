# ══════════════════════════════════════════════════════════════
# فحوص أمنية آلية — Cairo Store
# ══════════════════════════════════════════════════════════════
#
# أداتان آليتان، لكل واحدة لحظتها. التقسيم مبني على قياس لا تقدير،
# والتفاصيل الكاملة في SECURITY-TOOLING.md.
#
#   gitleaks  →  pre-commit   ~19 ث   أسرار في التغيير المُدرَج
#   semgrep   →  pre-push    ~141 ث   ثغرات كود في المستودع كله
#
# لماذا الفصل: محاولة commit بالأداتين معاً كلّفت **174 ثانية**. وقياس
# semgrep أظهر أن التكلفة في تحميل قواعده من السجلّ لا في الفحص — ملف
# واحد يكلّف 78 ثانية والمستودع كله 90. فتصغير النطاق لا يوفّر شيئاً،
# والحلّ نقل الأداة إلى لحظة تحتمل تكلفتها.
#
# المبدأ: سرّ يدخل التاريخ لا يُمحى بسهولة، فيُمنع عند الالتزام. وثغرة
# كود تُصلَح بـcommit تالٍ، فيكفي منعها قبل مغادرة الجهاز.
#
# ── التركيب على جهاز جديد ────────────────────────────────────
#   winget install Gitleaks.Gitleaks
#   pip install semgrep
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# ⚠️ السطر الأخير **لازم**: بلا `--hook-type pre-push` يبقى
# .git/hooks/pre-push غير موجود ولا يعمل semgrep إطلاقاً — والإعداد
# وحده لا يكفي.
#
# ⚠️ الأدوات تُنادى بأسمائها المجرّدة، فيجب أن تكون على PATH الذي يراه
# git. بعد تثبيت جديد أغلق الطرفية وافتحها — العملية القائمة ترث PATH
# قديماً ولا ترى التثبيت الجديد.
#
# ── لماذا repo: local و language: system ─────────────────────
# الخطّاف الرسمي لـgitleaks معرَّف بـlanguage: golang، فيطلب من
# pre-commit أن **يبني** الملف التنفيذي بـGo. وGo غير مثبَّت هنا، فكان
# كل commit يُرفض بـ«Executable gitleaks not found» — خطّاف يمنع العمل
# بلا أن يفحص سطراً واحداً. النداء المباشر للملف المثبَّت يتفادى ذلك:
# بلا Go ولا بناء ولا شبكة.

repos:
  - repo: local
    hooks:

      # ── أسرار في التغيير المُدرَج ─────────────────────────
      #
      # ⚠️ `--staged` **ليست اختيارية**. بدونها تفحص `--pre-commit`
      # تغييرات العمل غير المُدرَجة، لا ما سيدخل التاريخ. مقيس على سرّ
      # AWS مزروع ومُدرَج:
      #     بلا --staged → «no leaks found» · كود 0 ← يسمح بالـcommit
      #     مع  --staged → كود 1 ← يمنع
      # وقد مرّ سرّ فعلاً من هذه الثغرة وأمسكه semgrep بالصدفة — أي أن
      # الحماية كانت تتّكئ على تداخل عرضي بين أداتين لا على الأداة
      # المخصّصة للأسرار.
      #
      # `--redact` يمنع طباعة السرّ في الطرفية: لا معنى لمنعه من
      # المستودع ثم تسريبه إلى سجلّ الطرفية.
      #
      # `stages: [pre-commit]` مقصود: عند pre-push لا يوجد فهرس، فكان
      # يفحص **27 بايتاً** ثم يطبع «Passed» — تسع عشرة ثانية على فحص
      # العدم، وطمأنينة بلا سبب.
      #
      # `pass_filenames: false` لأن gitleaks يقرأ الفهرس بنفسه؛ وتمرير
      # الأسماء يجعله يفحص الملفات كاملة لا التغيير.
      - id: gitleaks
        name: gitleaks — أسرار في التغيير المُدرَج
        entry: gitleaks git --pre-commit --staged --redact -v
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # ── ثغرات كود في المستودع كله ────────────────────────
      #
      # `--error` لازمة: بدونها يطبع semgrep النتائج ويخرج بكود 0،
      # فيمرّ الدفع رغم وجود ثغرات.
      #
      # `--config auto` يجلب مجموعة قواعد مناسبة للغات المشروع من
      # السجلّ — يحتاج شبكة، وهو سبب الـ141 ثانية.
      #
      # النقطة في آخر الأمر تعني «المستودع كله»، و`pass_filenames:
      # false` يمنع pre-commit من إلحاق أسماء الملفات بعدها.
      #
      # الإنذارات الكاذبة تُوثَّق بـ`// nosemgrep: <rule>` **ملاصقاً
      # لسطر النتيجة** مع سبب مكتوب فوقه — لا في ملف تجاهل بعيد عن
      # الكود. راجع SECURITY-TOOLING.md.
      - id: semgrep
        name: semgrep — ثغرات كود في المستودع كله
        entry: semgrep --config auto --error .
        language: system
        pass_filenames: false
        stages: [pre-push]

      # ── ثغرات معروفة في الاعتماديات — يدوي ───────────────
      #
      # يشغَّل عند الطلب:
      #     pre-commit run trivy --hook-stage manual
      #
      # `stages: [manual]` **بقرارك** لا لأنه بطيء: الفحص المستهدف
      # يكلّف **ثانيتين** ويصلح للعمل التلقائي لو أردت. وسببٌ وجيه
      # لإبقائه يدوياً: قاعدة الثغرات تتغيّر بلا أن يتغيّر كودك، فقد
      # يفشل commit لم تلمس فيه شيئاً — وهو إزعاج بلا ذنب.
      #
      # ولماذا `composer.lock` لا `.`: هذا هو ما تضيفه الأداة فعلاً —
      # ثغرات **معروفة (CVE)** في الاعتماديات، وهو ما لا يفعله gitleaks
      # ولا semgrep. وفحص المجلد كله يستغرق 91 ثانية ولا يجد هدفاً
      # آخر — الملف نفسه هو كل ما فُحص.
      #
      # `--exit-code 1` لازمة: بدونها يطبع trivy النتائج ويخرج بكود 0
      # فيبدو ناجحاً وهو يبلّغ عن ثغرات — نفس فخّ `--error` في semgrep.
      #
      # `--scanners vuln` وحدها: فحص الأسرار عند gitleaks والإعدادات
      # الخاطئة لا هدف لها هنا (لا Dockerfile ولا Kubernetes).
      - id: trivy
        name: trivy — ثغرات معروفة في اعتماديات composer
        entry: trivy fs --scanners vuln --exit-code 1 composer.lock
        language: system
        pass_filenames: false
        stages: [manual]
