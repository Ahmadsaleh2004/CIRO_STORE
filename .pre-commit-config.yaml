# ══════════════════════════════════════════════════════════════
# Automated security checks — Cairo Store
# ══════════════════════════════════════════════════════════════
#
# Two automated tools, each at its own moment. The split rests on measurement rather than
# estimation, and the measurements it rests on are explained below, each in its place.
#
#   gitleaks  →  pre-commit   ~19 s   secrets in the staged change
#   semgrep   →  pre-push    ~141 s   code vulnerabilities across the whole repository
#
# Why the split: attempting a commit with both tools cost **174 seconds**. And measuring
# semgrep showed the cost is in loading its rules from the registry rather than in the scan
# — one file costs 78 seconds and the whole repository 90. So narrowing the scope saves
# nothing, and the answer is to move the tool to a moment that can bear its cost.
#
# The principle: a secret that enters the history is not easily erased, so it is blocked at
# commit time. A code vulnerability is fixed by a following commit, so blocking it before it
# leaves the machine is enough.
#
# ── Setting up on a new machine ──────────────────────────────
#   winget install Gitleaks.Gitleaks
#   pip install semgrep
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# ⚠️ The last line is **required**: without `--hook-type pre-push`, .git/hooks/pre-push is
# never created and semgrep does not run at all — the configuration alone is not enough.
#
# ⚠️ The tools are called by their bare names, so they must be on the PATH that git sees.
# After a fresh install, close the terminal and open it again — the running process
# inherited an older PATH and cannot see the new installation.
#
# ── Why repo: local and language: system ─────────────────────
# The official gitleaks hook is declared with language: golang, which asks pre-commit to
# **build** the executable with Go. And Go is not installed here, so every commit was
# rejected with "Executable gitleaks not found" — a hook that blocks the work without
# checking a single line. Calling the installed binary directly avoids that: no Go, no
# build, no network.

repos:
  - repo: local
    hooks:

      # ── Secrets in the staged change ─────────────────────
      #
      # ⚠️ `--staged` is **not optional**. Without it, `--pre-commit` scans the unstaged
      # working-tree changes rather than what is about to enter the history. Measured
      # against a planted, staged AWS secret:
      #     without --staged → "no leaks found" · code 0 ← the commit is allowed
      #     with    --staged → code 1 ← it is blocked
      # And a secret did pass through that gap, caught by semgrep by chance — which is to
      # say the protection was leaning on an accidental overlap between two tools rather
      # than on the tool meant for secrets.
      #
      # `--redact` stops the secret being printed in the terminal: there is no sense in
      # keeping it out of the repository and then leaking it into the terminal's scrollback.
      #
      # `stages: [pre-commit]` is deliberate: at pre-push there is no index, so it scanned
      # **27 bytes** and printed "Passed" — nineteen seconds spent checking nothing, and
      # reassurance without cause.
      #
      # `pass_filenames: false` because gitleaks reads the index itself; passing it names
      # makes it scan whole files rather than the change.
      - id: gitleaks
        name: gitleaks — secrets in the staged change
        entry: gitleaks git --pre-commit --staged --redact -v
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # ── Code vulnerabilities across the whole repository ─
      #
      # `--error` is required: without it semgrep prints the findings and exits 0, so the
      # push goes through despite the vulnerabilities.
      #
      # The dot at the end of the command means "the whole repository", and
      # `pass_filenames: false` stops pre-commit appending file names after it.
      #
      # False positives are documented with a `// nosemgrep: <rule>` **on the finding's own
      # line**, with the reason written above it — not in an ignore file far from the code,
      # so the exemption dies with the line it was justified for.
      #
      # ── Why this is `p/php` and a pinned version ─────────
      #
      # It used to be `entry: semgrep --config auto --error .` on `language: system`, and
      # CI ran `--config p/php --config .semgrep/` on a pinned pip install. Two different
      # rule sets and two different binaries, under a comment in ci.yml claiming they were
      # "literally what the pre-commit hooks do — the same command and the same rules".
      #
      # It cost exactly what such a claim costs: the security gate went green here and red
      # in CI, and the local pass said nothing about the push that followed. `--config auto`
      # also resolves against the registry at run time, so its rule set changes underneath
      # the project — the same commit can pass today and fail tomorrow with nothing in the
      # repository having moved.
      #
      # `language: python` rather than `system` for the same reason: `system` runs whichever
      # semgrep happens to be on PATH (1.174.0 on the machine this was written on, against
      # 1.145.0 in CI), while pre-commit builds its own virtualenv from the pin below. The
      # version is stated once, here, and ci.yml installs that same version.
      - id: semgrep
        name: semgrep — code vulnerabilities across the whole repository
        entry: semgrep --config p/php --config .semgrep/ --error .
        language: python
        additional_dependencies: ['semgrep==1.145.0']
        pass_filenames: false
        stages: [pre-push]

      # ── The project's local rules ────────────────────────
      #
      # Six rules in .semgrep/ encode faults that **occurred in this project** and were
      # never caught by a general rule. Each is proven against the broken version in the
      # history: it fires before the fix and falls silent after it.
      #
      # And they need neither a network nor an account — the rules are a local file.
      #
      # ⚠️ But they **save no time**: measured after they were written, they took 112
      # seconds against 141 for the full scan. I had written here that "they cost seconds,
      # not minutes" and corrected it after measuring — semgrep's cost is in **startup**
      # rather than in the number of rules, and the proof: scanning one file with auto costs
      # 78 seconds and the whole repository 90. So the gain here is **precision of aim**,
      # not speed, and it comes without a network or account dependency.
      #
      # They sat on `manual` for a while because the third rule fired on
      # `AdminProductModel::update`. That finding was closed (an explicit three-way contract
      # plus an existence check), so they were promoted here. And the rule is now silent
      # across the whole repository: **zero findings**.
      #
      # And a rule is never promoted to pre-push while it fires on the current code: a gate
      # that blocks every push is worked around within two days, which makes it worse than
      # its absence. Close the finding first, or document it with a nosemgrep.
      #
      # ⚠️ `manual` only, no longer `pre-push`. The hook above now passes `--config
      # .semgrep/` alongside `p/php`, so leaving this on pre-push scanned the local rules
      # twice on every push — and semgrep's cost is startup, so the second pass was
      # another ~112 seconds for a result already computed.
      #
      # It stays as its own hook because running the local rules **alone** is genuinely
      # useful: no network, no registry, a couple of seconds of intent rather than a full
      # scan. Run it by hand while working on a rule in .semgrep/:
      #     pre-commit run semgrep-local --hook-stage manual
      - id: semgrep-local
        name: semgrep — the project's local rules
        entry: semgrep --config .semgrep/ --error .
        language: python
        additional_dependencies: ['semgrep==1.145.0']
        pass_filenames: false
        stages: [manual]

      # ── Known vulnerabilities in the dependencies ────────
      #
      # `files` is the heart of this hook. Both of the common choices fall short:
      #
      #   manual only     → you forget it. You add a vulnerable package and find out a
      #                     month later.
      #   on every commit → two seconds × every commit, over a file that changes once every
      #                     couple of months. And a commit in which you touched nothing may
      #                     fail, because the vulnerability database changes without your
      #                     code changing.
      #
      # And `files: ^composer\.lock$` gives the third: pre-commit skips the hook entirely
      # unless `composer.lock` is **staged** — that is, it runs automatically at the one
      # moment a new package enters, and at zero cost on every other commit.
      #
      # And `manual` remains for the periodic sweep — because a vulnerability may be
      # announced for a package you have had for months, without the file changing:
      #     pre-commit run trivy --hook-stage manual
      #
      # And why `composer.lock` rather than `.`: this is what the tool actually adds —
      # **known (CVE)** vulnerabilities in the dependencies, which neither gitleaks nor
      # semgrep does. And scanning the whole directory takes 91 seconds and finds no other
      # target — the file itself is all that was scanned.
      #
      # `--exit-code 1` is required: without it trivy prints the findings and exits 0, so it
      # looks successful while reporting vulnerabilities — the same trap as `--error` in
      # semgrep.
      #
      # `--scanners vuln` alone: the secret scanning belongs to gitleaks, and
      # misconfiguration scanning has no target here (no Dockerfile rules, no Kubernetes).
      - id: trivy
        name: trivy — known vulnerabilities in the composer dependencies
        entry: trivy fs --scanners vuln --exit-code 1 composer.lock
        language: system
        pass_filenames: false
        files: ^composer\.lock$
        stages: [pre-commit, manual]
