repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact -v
        language: system
        pass_filenames: false
      - id: semgrep
        name: semgrep
        entry: semgrep --config auto --error .
        language: system
        pass_filenames: false
